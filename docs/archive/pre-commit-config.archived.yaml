# =============================================================================
# 【作废说明 / ARCHIVED】2026-10-17；原路径：仓库根 `.pre-commit-config.yaml`
# =============================================================================
# **本配置里的 31 个 hook（8 个远端 + 23 个 local）从未执行过一次。**
# 依据（实测）：`git config --local core.hooksPath` = `D:\PilotStd\.husky`（由
# `web/package.json` 的 `prepare` 设置），`.husky/pre-commit` 只转发
# `bash scripts/check_all.sh --fast --guards --local`，**从不调用 `pre-commit run`**
# （全库 `git grep "pre-commit run"` 零命中）。故本文件长期只是"脚本清单"，
# 不存在执行效果——这也是"门禁脚本存在但无人调用"这一系统性缺口的根源。
#
# 处置（体检批次 A：入口收口；docs/debt/05-audit-2026-10-17.md 的 A-1/A-2/A-3）：
#   · **唯一活入口是 `.husky/`**，由两个钩子组成：
#       .husky/pre-commit —— check_all.sh --fast --guards --local
#                            + SEC-001 装饰器顺序 / G-013 测试联动 / Mixin 治理
#                            （后三项原仅存于本文件的 local hook，现已接线）
#       .husky/commit-msg —— 提交信息校验（本文件 commit-msg-format 的替代实现，
#                            并兼容 merge: / merge(xxx): / test+docs: 等历史形态）
#   · 本地 `--fast` 独有的 5 项（G-005 / G-012 schema / G-012 注释密度 / G-048 / G-049）
#     已补为 `.github/workflows/ci.yml` 的 `repo-compliance` 显式步骤；G-031 按设计
#     **仍只在本地**（直推 main 时 base..HEAD 恒空 → 假绿）。
#   · 其余 hook 的去向（逐个复核，均**未**在本文件中接管）：
#       trailing-whitespace / end-of-file-fixer / check-yaml / check-added-large-files
#         —— 仓库未接管，属"格式类便利钩子"，非门禁判据；
#       ruff --fix / ruff-format / mypy —— CI 以 `ruff check`（G-038）、`mypy` 执行；
#       detect-secrets —— CI `security-scan` 的 detect-secrets 步骤；
#       py-compile-core —— CI `test-backend` 的 `python -m compileall pilotstd/ui/core/`；
#       forbid-test-imports —— CI `test-backend` 同名步骤；
#       update-capabilities —— 已被 `generate_capabilities.py` + CI
#                              `check_capabilities_sync.py` 取代（本文件仍指旧脚本）；
#       check-dead-code-python (vulture) —— `check_all.sh --deep` 的 G-020；
#       check-dead-code-typescript (ts-prune) —— CI `test-frontend` 的
#                                                 "Check dead TypeScript exports"；
#       check-all / gate-10 / gate-11 / gate-13 / docs-sync-check / gate-sensitive-fields /
#       gate-adapters / gate-docker-mounts / gate-define-options / gate-no-hardcoded-admin /
#       run-gates / check-dependencies / check-changelog-version / check-ui-sensitive-fields /
#       gate-10-code-size / no-new-mixin / check-decorator-order / commit-msg-format
#         —— 已由 `.husky/` 的两个钩子或 CI 的显式步骤承担（见上）。
#   · **保留原文（含 ruff/mypy 的 rev 钉版）仅为追溯**"当年打算跑什么、钉的哪个版本"。
#     **不要再把它接回 `core.hooksPath`，也不要 `pre-commit install`**——否则会得到
#     两套互相矛盾的口径（例如本文件 ruff 钉 v0.11.6 而 CI/本地跑本地版本）。
# =============================================================================

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--follow-imports=skip, --ignore-missing-imports]
        exclude: ^(tests/|pilotstd/ui/)
        additional_dependencies: [types-requests]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: local
    hooks:
      - id: forbid-test-imports
        name: Forbid production imports from test modules
        entry: bash -c 'if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then echo "❌ Forbidden import detected"; exit 1; fi'
        language: system
        files: \.py$
        exclude: ^tests/
        pass_filenames: false
        stages: [manual]

      - id: no-new-mixin
        name: 禁止新增 Mixin（请优先使用组合模式）
        entry: python scripts/check_mixin.py
        language: python
        files: \.py$
        exclude: ^scripts/

      - id: check-decorator-order
        name: SEC-001 装饰器顺序检查（@require_role 必须在 @router 内层）
        entry: python scripts/check_decorator_order.py
        language: python
        files: ^docker/api/.*\.py$
        pass_filenames: false

      - id: update-capabilities
        name: 自动更新 capabilities_registry.md 行号
        entry: python scripts/update_capabilities.py
        language: python
        files: \.py$
        pass_filenames: false
        stages: [manual]
        always_run: true

      - id: check-all
        name: 三位一体治理体系 - 本地检查（门禁支柱）
        entry: scripts/check_all.sh
        language: script
        files: \.py$
        pass_filenames: false

      - id: gate-10
        name: G-010 代码规模控制 (阻断模式)
        entry: python scripts/check_g_010_code_size.py
        language: python
        files: \.py$
        exclude: ^(tests/|pilotstd_env/|web/)
        pass_filenames: false

      - id: gate-11
        name: G-011 — 动态属性完整性检查
        entry: python scripts/check_g_011_attr_integrity.py
        language: python
        files: \.py$
        exclude: ^(tests/|pilotstd_env/|web/)
        pass_filenames: false
        stages: [manual]

      - id: gate-13
        name: G-013 — 测试覆盖率伴随检查
        entry: python scripts/check_g_013_test_coverage.py
        language: python
        files: \.py$
        pass_filenames: false
        always_run: true

      - id: docs-sync-check
        name: 文档自动同步门禁（检测+修复）
        entry: python scripts/docs_sync_check.py
        language: python
        pass_filenames: false
        always_run: true

      - id: gate-sensitive-fields
        name: G-018 扩展 — 敏感字段掩码
        entry: python scripts/check_ui_sensitive_fields.py
        language: python
        files: \.(vue|py)$
        pass_filenames: false
        stages: [manual]

      - id: gate-adapters
        name: G-025 — 适配器列表一致性
        entry: python scripts/check_g_025_adapters.py
        language: python
        files: docker/api/adapter\.py$
        pass_filenames: false
        stages: [manual]

      - id: gate-docker-mounts
        name: G-026 — Docker 挂载黑名单
        entry: python scripts/check_g_026_docker_mounts.py
        language: python
        files: docker-compose\.yml$
        pass_filenames: false
        stages: [manual]

      - id: gate-define-options
        name: G-027 — Vue 组件 defineOptions 检查
        entry: python scripts/check_g_027_define_options.py
        language: python
        files: \.vue$
        pass_filenames: false
        stages: [manual]

      - id: gate-no-hardcoded-admin
        name: G-028 — 禁止硬编码 admin
        entry: python scripts/check_g_028_no_hardcoded_admin.py
        language: python
        files: \.(py|vue|ts|js|sh|yaml|yml|toml)$
        pass_filenames: false
        stages: [manual]

      - id: run-gates
        name: Run all GATE check scripts
        entry: bash -c 'for script in scripts/check_*.py; do python "$script" || exit 1; done'
        language: system
        files: \.py$
        pass_filenames: false
        stages: [manual]

      - id: check-dead-code-python
        name: 门禁 G-007 — Python 死代码检测
        entry: bash -c 'vulture pilotstd/ docker/ tests/ scripts/ whitelist.py --min-confidence=80'
        language: system
        files: \.py$
        pass_filenames: false
        stages: [manual]

      - id: check-dead-code-typescript
        name: 门禁 G-017 — TypeScript 死代码检测
        entry: bash -c 'cd web && npx ts-prune --error'
        language: system
        files: \.(ts|vue)$
        pass_filenames: false
        stages: [manual]

      - id: check-dependencies
        name: G-008 — 依赖完整性检查
        entry: python scripts/check_dependencies.py
        language: system
        files: \.py$|requirements-docker\.txt$
        pass_filenames: false
        stages: [manual]

      - id: check-changelog-version
        name: G-009 — CHANGELOG 版本一致性
        entry: python scripts/check_changelog_version.py
        language: system
        files: (CHANGELOG\.md|pilotstd/__init__\.py)$
        pass_filenames: false
        stages: [manual]

      - id: check-ui-sensitive-fields
        name: G-018 — UI 敏感字段保护
        entry: python scripts/check_ui_sensitive_fields.py
        language: system
        files: \.(vue|py)$
        pass_filenames: false
        stages: [manual]

      - id: gate-10-code-size
        name: G-010 — 代码规模控制
        entry: python scripts/check_g_010_code_size.py
        language: system
        files: \.(py|ts|vue)$
        pass_filenames: false
        stages: [manual]

      - id: py-compile-core
        name: Compile ui/core/
        entry: python -m py_compile
        files: ^pilotstd/ui/core/.*\.py$
        language: system
        pass_filenames: true
        stages: [pre-commit]

      - id: commit-msg-format
        name: 提交信息格式校验
        entry: >-
          bash -c 'MSG=$(cat "$1"); if ! echo "$MSG" | grep -qE "^(feat|fix|refactor|docs|test|chore|ci|style|perf|build|revert)(\([a-z\-]+\))?: .+"; then echo ""; echo "❌ 提交信息格式错误！"; echo "   当前内容: $MSG"; echo ""; echo "   正确格式: <type>(<scope>): <description>"; echo "   示例: feat(parser): 支持 PDF 公告解析"; echo "   示例: fix(query): 修复空结果集崩溃"; echo "   示例: refactor(core): 提取状态机逻辑"; echo ""; echo "   允许的 type: feat|fix|refactor|docs|test|chore|ci|style|perf|build|revert"; echo ""; exit 1; fi' --
        language: system
        stages: [commit-msg]
