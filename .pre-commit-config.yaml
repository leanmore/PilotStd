repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--follow-imports=skip, --ignore-missing-imports]
        exclude: ^(tests/|pilotstd/ui/)
        additional_dependencies: [types-requests]

  - repo: local
    hooks:
      - id: forbid-test-imports
        name: Forbid production imports from test modules
        entry: bash -c 'if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then echo "❌ Forbidden import detected"; exit 1; fi'
        language: system
        files: \.py$
        exclude: ^tests/
        pass_filenames: false

      - id: no-new-mixin
        name: 禁止新增 Mixin（请优先使用组合模式）
        entry: python scripts/check_mixin.py
        language: python
        files: \.py$
        exclude: ^scripts/
