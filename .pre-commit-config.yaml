repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--follow-imports=skip, --ignore-missing-imports]
        exclude: ^(tests/|pilotstd/ui/)
        additional_dependencies: [types-requests]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: local
    hooks:
      - id: forbid-test-imports
        name: Forbid production imports from test modules
        entry: bash -c 'if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then echo "❌ Forbidden import detected"; exit 1; fi'
        language: system
        files: \.py$
        exclude: ^tests/
        pass_filenames: false
        stages: [manual]

      - id: no-new-mixin
        name: 禁止新增 Mixin（请优先使用组合模式）
        entry: python scripts/check_mixin.py
        language: python
        files: \.py$
        exclude: ^scripts/

      - id: update-capabilities
        name: 自动更新 capabilities_registry.md 行号
        entry: python scripts/update_capabilities.py
        language: python
        files: \.py$
        pass_filenames: false
        stages: [manual]
        always_run: true

      - id: gate-15
        name: GATE-15 代码规模控制 (阻断模式)
        entry: python scripts/check_gate_15_code_size.py
        language: python
        files: \.py$
        exclude: ^(tests/|pilotstd_env/|web/)
        pass_filenames: false

      - id: gate-16
        name: GATE-16 — 动态属性完整性检查
        entry: python scripts/check_gate_16_attr_integrity.py
        language: python
        files: \.py$
        exclude: ^(tests/|pilotstd_env/|web/)
        pass_filenames: false
        stages: [manual]

      - id: docs-sync-check
        name: 文档同步检查
        entry: bash scripts/check_docs_sync.sh
        language: system
        pass_filenames: false
        stages: [commit-msg]
        always_run: true

      - id: gate-allowed-paths
        name: 门禁 GATE-01 — 白名单路径检查
        entry: python scripts/check_allowed_paths.py
        language: python
        files: pilotstd/core/path_guard\.py$
        pass_filenames: false
        stages: [manual]

      - id: gate-log-tags
        name: 门禁 GATE-02 — 日志标签完整性
        entry: python scripts/check_log_tags.py
        language: python
        files: (pilotstd/core/logger\.py|pilotstd/query/engine\.py)$
        pass_filenames: false
        stages: [manual]

      - id: gate-sensitive-fields
        name: 门禁 GATE-03 — 敏感字段掩码
        entry: python scripts/check_sensitive_fields.py
        language: python
        files: docker/api/settings\.py$
        pass_filenames: false
        stages: [manual]

      - id: gate-adapters
        name: 门禁 GATE-05 — 适配器列表一致性
        entry: python scripts/check_adapters.py
        language: python
        files: docker/api/adapter\.py$
        pass_filenames: false
        stages: [manual]

      - id: gate-docker-mounts
        name: 门禁 GATE-06 — Docker 挂载黑名单
        entry: python scripts/check_docker_mounts.py
        language: python
        files: docker-compose\.yml$
        pass_filenames: false
        stages: [manual]

      - id: run-gates
        name: Run all GATE check scripts
        entry: bash -c 'for script in scripts/check_*.py; do python "$script" || exit 1; done'
        language: system
        files: \.py$
        pass_filenames: false
        stages: [manual]

      - id: check-dead-code-python
        name: 门禁 GATE-07a — Python 死代码检测
        entry: bash -c 'vulture pilotstd/ docker/ tests/ scripts/ whitelist.py --min-confidence=80'
        language: system
        files: \.py$
        pass_filenames: false
        stages: [manual]

      - id: check-dead-code-typescript
        name: 门禁 GATE-07b — TypeScript 死代码检测
        entry: bash -c 'cd web && npx ts-prune --error'
        language: system
        files: \.(ts|vue)$
        pass_filenames: false
        stages: [manual]

      - id: check-dependencies
        name: 门禁 GATE-08 — 依赖完整性检查
        entry: python scripts/check_dependencies.py
        language: system
        files: \.py$|requirements-docker\.txt$
        pass_filenames: false
        stages: [manual]

      - id: check-changelog-version
        name: 门禁 GATE-09 — CHANGELOG 版本一致性
        entry: python scripts/check_changelog_version.py
        language: system
        files: (CHANGELOG\.md|pilotstd/__init__\.py)$
        pass_filenames: false
        stages: [manual]

      - id: check-ui-sensitive-fields
        name: 门禁 GATE-10 — UI 敏感字段保护
        entry: python scripts/check_ui_sensitive_fields.py
        language: system
        files: \.vue$
        pass_filenames: false
        stages: [manual]

      - id: check-gate-11
        name: 门禁 GATE-11 — 禁止硬编码 admin
        entry: python scripts/check_gate_11.py
        language: system
        files: \.(py|vue|ts|js|sh|yaml|yml|toml)$
        pass_filenames: false
        stages: [manual]

      - id: check-gate-12
        name: 门禁 GATE-12 — Vue 组件 defineOptions 检查
        entry: python scripts/check_gate_12.py
        language: system
        files: \.vue$
        pass_filenames: false
        stages: [manual]

      - id: check-gate-13
        name: 门禁 GATE-13 — 禁止前端硬编码 superuser admin
        entry: python scripts/check_gate_13.py
        language: system
        files: \.(vue|ts|js)$
        pass_filenames: false
        stages: [manual]

      - id: check-gate-14
        name: 门禁 GATE-14 — OCR 敏感字段掩码一致性
        entry: python scripts/check_gate_14_ocr_mask_consistency.py
        language: system
        files: web/src/views/SettingsView\.vue$
        pass_filenames: false
        stages: [manual]

      - id: gate-15-code-size
        name: 门禁 GATE-15 — 代码规模控制
        entry: python scripts/check_gate_15_code_size.py
        language: system
        files: \.(py|ts|vue)$
        pass_filenames: false
        stages: [manual]
