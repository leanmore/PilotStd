# PilotStd — 标准文件管理工具
# 部署: docker compose up -d
#
# 超级用户密码首次启动自动生成（或通过 SUPERUSER_PASSWORD 指定），
# 执行 docker logs pilotstd 查看。
#
# 目录说明：
#   ./inbox → 监控目录，新文件丢这里，扫描入口
#   ./standards → 标准库，归档后的最终存放位置

services:
  pilotstd:
    image: ghcr.io/leanmore/pilotstd:latest
    container_name: pilotstd
    ports:
      - "9028:9028"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./inbox:/inbox
      - ./standards:/standards
      - ./.env:/app/.env
      # 挂载 docker.sock 允许容器调用 Docker API（镜像级更新 / 容器自重启）。
      # 安全注意：挂载后容器可控制宿主机 Docker，仅在信任容器内代码时启用。
      # 方案 C 的代码级重启（/api/system/restart）不依赖此挂载，可注释掉。
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
      # 标准库根目录（必填，Docker 卷挂载位置，默认 /standards）
      - STANDARD_ROOT=/standards
      # 自动更新：true/release=开启（版本比较+前端+依赖）, false=关闭
      - PILOTSTD_AUTO_UPDATE=true
      # 超级用户（可选，默认 admin）
      - SUPERUSER=admin
      # 超级用户初始密码（可选，不填则自动生成随机密码，输出到日志）
      # - SUPERUSER_PASSWORD=your_password
      # 群晖 NAS 文件权限（可选）—— SSH 执行 id 查看 uid/gid
      # - PUID=1026
      # - PGID=100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9028/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
