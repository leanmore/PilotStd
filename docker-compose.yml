# PilotStd — 标准文件管理工具
# 部署: docker compose up -d
#
# 安全凭证 JWT_SECRET 和 ADMIN_PASSWORD 首次启动自动生成，
# 执行 docker logs pilotstd 查看。
#
# 目录说明：
#   ./inbox → 监控目录，新文件丢这里，扫描入口
#   ./standards → 标准库，归档后的最终存放位置

services:
  pilotstd:
    image: ghcr.io/leanmore/pilotstd:latest
    container_name: pilotstd
    ports:
      - "9028:9028"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./inbox:/inbox
      - ./standards:/standards
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
      # 自动更新：true=开启, false=关闭
      - PILOTSTD_AUTO_UPDATE=true
      # 超级用户（可选，默认 admin）
      - SUPERUSER=admin
      # 超级用户初始密码（可选，不填则自动生成随机密码，输出到日志）
      # - SUPERUSER_PASSWORD=your_password
      - STANDARD_ROOT=/standards
      # 安全凭证（可选）—— 留空则首次启动自动生成
      # - ADMIN_USERNAME=admin
      # - ADMIN_PASSWORD=你的密码
      # 群晖 NAS 文件权限（可选）—— SSH 执行 id 查看 uid/gid
      # - PUID=1026
      # - PGID=100
    restart: unless-stopped
