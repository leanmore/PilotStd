<script>

        },
        mounted() {
            this.getHeaderHeight()
            window.addEventListener('resize', this.handleResize)
        },
        watch: {
            divHeight(newValue) {
                this.getHeaderHeight()
            }
        },
        methods: {
            handleResize() {
                this.divHeight = window.innerHeight
            },
            changeTabs(e) {
                this.tabActive = e
                this.getHeaderHeight(e)
            },
            getHeaderHeight(e) {
                var box = document.getElementById("headerid")
                var contentHeight = window.getComputedStyle(box).height.split('px')[0]
                var appBox = document.getElementById("app")
                var appContentHeight = window.getComputedStyle(appBox).height.split('px')[0]
                if (this.tabActive == 1) {
                    this.contentHeight = Number(appContentHeight) - 252 - 160
                } else {
                    this.contentHeight = Number(appContentHeight) - 359 - 160
                }
            },
            goto(guid, type) {
                goto(guid, type)
            },
            listSearch(kw) {
                listSearch(kw)
            }
        }
    })

    //enter事件
    function scheck() {
        if (event.keyCode == 13) {
            listSearch('');
        }
    }

    //搜索
    function listSearch(kw) {
        if (app.tabActive == 1) {
            var keyword = '';
            if (kw != '') {
                keyword = kw;
            } else {
                keyword = $('input[name=keyword]').val()
                // keyword=document.getElementById("keyword").value;
                if (keyword == '') {
                    alert("请输入要搜索的关键词！");
                    return false;
                }
            }
            form1.tabActive.value = "1"
            form1.keyword.value = keyword;
            form1.task.value = 'index';
            form1.action = '/db';
            form1.submit();
        } else {
            debugger
            if ($('input[name=keyword]').val().length == 0 && $('#standard_code').val() != null) {
                form1.keyword.value = $('#standard_code').val()
            }
            form1.tabActive.value = "2"
            form1.task.value = 'index';
            form1.action = '/db';
            form1.submit();
        }
    }

    // 地方标准列表
    function listDf(){
        form1.task.value="listStandardDF";
        form1.action='/db';
        form1.submit();
    }
    function fresh()
    {
        window.location.reload();
    }
</script>
