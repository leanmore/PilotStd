# 站点能力模型 v2.0（阶段一产出）
# 用途：路由系统可消费的结构化能力模型
# 数据来源：docs/analysis/site_classification_partial.md（v1.1 分类表）
#          docs/analysis/site_classification_status.json（v1.1 状态元数据）
#          pilotstd/query/site_config.py（ADAPTER_DEFAULT_PROFILES.rate_limit.batch_limit）
# 生成日期：2026-08-17
#
# 字段说明：
#   site_id                        站点标识符（对应适配器名）
#   classification.level1/level2   站点分类（综合/特色 + 二级分类）
#   capabilities.supported_types   支持的标准前缀列表（路由决策时按体系聚合）
#   capabilities.industries        覆盖行业领域，空为 []
#   capabilities.is_international  是否覆盖国际标准（仅"全综合"站点可为 true）
#   capabilities.search_reliability 搜索可靠性评级（unknown/low/medium/high），任务1.2更新 gongbiaoku
#   constraints.batch_limit        单批次请求上限（来自 site_config.py）
#   status.historical_hit_rate     历史命中率（query_metrics 无可查数据，默认 0.0）
#   notes                          特殊说明/风险标记
schema_version: "2.0"
sites:
