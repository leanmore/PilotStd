[project]
name = "pilotstd"
version = "0.55.33"
description = "标准文件管理工具"
# Note: Dependencies are managed via requirements*.txt for Docker/PyInstaller builds.
# PyPI distribution is not supported.
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.mypy]
exclude = [
    "pilotstd_env/",          # 虚拟环境目录，始终排除
    "pilotstd/templates/",    # Jinja2 模板目录含 {{ }} 占位符，非 Python 源码
    "whitelist.py",           # Vulture 白名单（非 Python 代码）
]
explicit_package_bases = true
# === 迁移自 VS Code 用户配置 (B1, 2026-08-21) ===
warn_return_any = true      # --warn-return-any：函数返回值含 Any 时告警
implicit_optional = false   # --no-implicit-optional：禁止隐式 Optional 参数
# 注：--follow-imports=skip 未迁移（与项目 overrides 白名单策略冲突，详见迁移报告 B1 冲突清单）
# 注：--show-column-numbers 为 mypy 默认行为；--ignore-missing-imports 已由下方 [[tool.mypy.overrides]] 白名单覆盖

[[tool.mypy.overrides]]
module = [
    "pypdf",
    "docx",
    "cryptography.fernet",
    "PyQt6.QtWidgets",
    "ddddocr",
    "watchdog.observers",
    "watchdog.events",
    "jose",
    "apscheduler.*",
    "urllib3.*",
]
ignore_missing_imports = true

# UI 目录 Mixin 模式：PyQt6 类型系统与 mixin 架构冲突
# (QMessageBox/QMenu/QHeaderView | None / self 非 QWidget)
# 压制直到 mixin 重构为 QWidget 子类——参见 STATUS.md 3.14 节技术债
[[tool.mypy.overrides]]
module = "pilotstd.ui.*"
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["whitelist.py", "pilotstd/templates/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Re-export module: imports consumed by external modules (notification.manager), not used locally
"pilotstd/core/notification/_message_builders.py" = ["F401"]
"tests/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"pilotstd/ui/themes.py" = ["E501"]
"tests/test_announce_parser_unit.py" = ["E501"]
"scripts/probe_*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# testpaths 限定测试目录，排除 pilotstd/templates 下的 cookiecutter 模板
testpaths = ["tests"]

# ── 常用命令 ──────────────────────────────────────────
# type-check:      mypy pilotstd/ docker/ tests/ pilotstd/ui/
# lint:            ruff check pilotstd/ docker/ tests/ pilotstd/ui/
# format:          ruff format pilotstd/ docker/ tests/ pilotstd/ui/

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pilotstd"]
include-package-data = true

[tool.setuptools.package-data]
pilotstd = ["**/*.yaml", "**/*.json", "**/*.sql"]

[tool.vulture]
exclude = ["pilotstd/templates/"]
ignore_names = ["exc_type", "exc_val", "exc_tb"]
min_confidence = 100

[tool.coverage.report]
# 整体门禁由 CI 分层命令控制，此处设为 0 避免冲突
fail_under = 51
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]

[tool.coverage.run]
# GUI 多进程覆盖率收集：Qt Worker 子进程需 concurrency=multiprocessing
# parallel=true 确保 xdist 多 worker 覆盖率数据正确合并
concurrency = ["multiprocessing"]
parallel = true
