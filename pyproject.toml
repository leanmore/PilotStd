[project]
name = "pilotstd"
version = "0.54.7"
description = "标准文件管理工具"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.mypy]
exclude = [
    "pilotstd_env/",          # 虚拟环境目录，始终排除
    "whitelist.py",           # Vulture 白名单（非 Python 代码）
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "PyPDF2",
    "docx",
    "cryptography.fernet",
    "PyQt6.QtWidgets",
    "ddddocr",
    "watchdog.observers",
    "watchdog.events",
    "jose",
    "apscheduler.*",
    "urllib3.*",
]
ignore_missing_imports = true

# UI 目录 Mixin 模式：PyQt6 类型系统与 mixin 架构冲突
# (QMessageBox/QMenu/QHeaderView | None / self 非 QWidget)
# 压制直到 mixin 重构为 QWidget 子类——参见 STATUS.md 3.14 节技术债
[[tool.mypy.overrides]]
module = "pilotstd.ui.*"
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"pilotstd/ui/themes.py" = ["E501"]
"tests/test_announce_parser_unit.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── 常用命令 ──────────────────────────────────────────
# type-check:      mypy pilotstd/ docker/ tests/ pilotstd/ui/
# lint:            ruff check pilotstd/ docker/ tests/ pilotstd/ui/
# format:          ruff format pilotstd/ docker/ tests/ pilotstd/ui/

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pilotstd"]
include-package-data = true

[tool.setuptools.package-data]
pilotstd = ["**/*.yaml", "**/*.json", "**/*.sql"]
