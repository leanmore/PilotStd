[project]
name = "pilotstd"
version = "0.18.1"
description = "标准文件管理工具"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[tool.mypy]
exclude = [
    "pilotstd_env/",          # 虚拟环境目录，始终排除
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "PyPDF2",
    "docx",
    "cryptography.fernet",
    "PyQt6.QtWidgets",
    "ddddocr",
    "watchdog.observers",
    "watchdog.events",
    "jose",
    "apscheduler.*",
    "urllib3.*",
]
ignore_missing_imports = true

# UI 目录 Mixin 模式：跨类动态属性 mypy 无法推断，压制 attr-defined
[[tool.mypy.overrides]]
module = "pilotstd.ui.*"
disable_error_code = ["attr-defined"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── 常用命令 ──────────────────────────────────────────
# type-check:      mypy pilotstd/ docker/ tests/ pilotstd/ui/
# lint:            ruff check pilotstd/ docker/ tests/ pilotstd/ui/
# format:          ruff format pilotstd/ docker/ tests/ pilotstd/ui/
