# PilotStd PyInstaller — Windows exe 编译 + GitHub Release
# 由 ci.yml 的 version-bump job 打 tag 后触发，不负责版本号管理
name: PyInstaller
run-name: PyInstaller | ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
    paths:
      - 'pilotstd/**'
      - 'main.py'
      - 'PilotStd.spec'
      - 'requirements.txt'
      - 'assets/**'
      - 'icon.ico'
      - 'pilotstd/i18n/**'
      - '.github/workflows/pyinstaller.yml'
  workflow_dispatch:
    inputs:
      description:
        description: '运行描述'
        required: false
        default: '手动触发'

env:
  PYTHON_VERSION: '3.12'

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(python -c "from pilotstd import __version__; print(__version__)")"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          $ErrorActionPreference = "Stop"
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Python: $(python --version)"
          Write-Host "PyInstaller: $(pyinstaller --version)"
          if (-not (Test-Path data)) { New-Item -ItemType Directory data | Out-Null }
          $free = (Get-PSDrive -Name (Get-Location).Drive.Name).Free
          $free_gb = "{0:N1} GB" -f ($free / 1GB)
          Write-Host "可用磁盘空间: $free_gb"
          if ($free -lt 3GB) {
            Write-Error "磁盘空间不足 (需要 ≥3GB，实际 $free_gb)"
            exit 1
          }
          pyinstaller PilotStd.spec --noconfirm
          $exe_path = "dist/PilotStd.exe"
          if (-not (Test-Path $exe_path)) {
            Write-Error "PyInstaller 产物缺失: $exe_path"
            exit 1
          }
          $exe_size_mb = "{0:N1} MB" -f ((Get-Item $exe_path).Length / 1MB)
          if ((Get-Item $exe_path).Length -lt 10MB) {
            Write-Error "PyInstaller 产物异常(过小): $exe_path ($exe_size_mb)"
            exit 1
          }
          Write-Host "产物: $exe_path ($exe_size_mb)"

      - name: Package to zip
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $zip_name = "PilotStd-$version.zip"
          Compress-Archive -Path "dist/PilotStd.exe" -DestinationPath $zip_name
          if (-not (Test-Path $zip_name)) {
            Write-Error "打包失败: $zip_name"
            exit 1
          }
          $zip_size = "{0:N0} MB" -f ((Get-Item $zip_name).Length / 1MB)
          Write-Host "打包完成: $zip_name ($zip_size)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PilotStd-${{ steps.version.outputs.version }}
          path: PilotStd-${{ steps.version.outputs.version }}.zip
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: PilotStd ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            ## PilotStd ${{ steps.version.outputs.version }}

            > 提交: ${{ github.sha }}

            PyInstaller 编译的 Windows 单文件版本。下载 `PilotStd-${{ steps.version.outputs.version }}.zip` 解压后运行 `PilotStd.exe`。

            ### 系统要求
            - Windows 10/11 64-bit
            - 无需安装 Python

            ### 部署方式
            1. 下载 `PilotStd-${{ steps.version.outputs.version }}.zip` 并解压
            2. 双击 `PilotStd.exe` 启动
            3. 首次运行会自动创建 `data/` 和 `logs/` 目录
          files: PilotStd-${{ steps.version.outputs.version }}.zip
