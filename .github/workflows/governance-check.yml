name: Governance Docs Check

on:
  pull_request:
    paths:
      - 'docs/governance/**'
  # E-5（2026-10-18）：本仓以直推 main 为主，原触发条件让治理检查在直推路径永不执行
  push:
    branches: [main]
    paths:
      - 'docs/governance/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run governance check script
        run: bash scripts/check_governance_docs.sh
