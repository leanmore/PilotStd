# PilotStd CI — 测试 + 版本管理 + Docker 镜像推送 ghcr.io
# 版本治理已原子化：version_bump job 负责写回三文件+打tag，build job 只读版本号
name: Docker CI
run-name: Docker | ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'pilotstd/**'
      - 'tests/**'
      - 'web/**'
      - 'docker/**'
      - 'requirements*.txt'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'main.py'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      description:
        description: '运行描述（显示在 Actions 列表中）'
        required: false
        default: '手动触发'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pilotstd
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 0: 版本号 bump（原子化——写回三个文件 + 打 tag）
  # ════════════════════════════════════════════════════════════════
  version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run bump_version.py
        id: bump
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          python .github/scripts/bump_version.py --github --update "$COMMIT_MSG"
          NEW_VER=$(python -c "from pilotstd import __version__; print(__version__)")
          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VER"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pilotstd/__init__.py pyproject.toml web/package.json
          if git diff --cached --quiet; then
            echo "版本号未变更，跳过提交"
          else
            git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Create and push tag
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 已存在，跳过"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "已推送 git tag: $TAG"
          fi

  # ════════════════════════════════════════════════════════════════
  # Job 1: 后端测试
  # ════════════════════════════════════════════════════════════════
  test-backend:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install pytest pytest-xdist

      - name: Forbid production imports from test modules
        run: |
          if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then
            echo "❌ Production code imports test-only module. Abort."
            exit 1
          fi
          echo "✅ No forbidden imports found."

      - name: Run backend tests
        env:
          STANDARD_ROOT: /tmp/standards
        run: |
          mkdir -p /tmp/standards
          python -m pytest tests/ -q --tb=short -n auto \
            --deselect "tests/test_manager.py" \
            --deselect "tests/test_organizer.py" \
            --deselect "tests/test_core.py::TestFileUtils::test_safe_move_and_copy" \
            --deselect "tests/test_cli.py::TestCLIMove::test_cmd_move" \
            --deselect "tests/test_pipeline_router.py" \
            --deselect "tests/test_e2e_adapters.py"

  # ════════════════════════════════════════════════════════════════
  # Job 2: 安全扫描
  # ════════════════════════════════════════════════════════════════
  security-scan:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install bandit pip-audit

      - name: Run Bandit (static security analysis — 建议性)
        run: bandit -r pilotstd/ -f json -o bandit-report.json || echo "bandit found issues (non-blocking)"
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability scan — 建议性)
        run: pip-audit || echo "pip-audit found issues (non-blocking)"
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════
  # Job 3: 前端测试
  # ════════════════════════════════════════════════════════════════
  test-frontend:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and test
        run: |
          cd web
          npm ci
          npx vitest run

  # ════════════════════════════════════════════════════════════════
  # Job 4: 构建 + 推送 Docker 镜像
  # ════════════════════════════════════════════════════════════════
  build-and-push:
    needs: [test-frontend, version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped') &&
      needs.test-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ── 版本号（由 version-bump job 产出）──
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ -n "${{ needs.version-bump.outputs.new_version }}" ]]; then
            VERSION="v${{ needs.version-bump.outputs.new_version }}"
          else
            VERSION=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$VERSION" ]; then
              echo "::error::无可用版本标签"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # ── 2a: 构建前端 ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      # ── 2b: 启用 Buildx（Registry Cache 必需）──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 2c: Docker 登录 ──
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 2d: 构建 + 推送（含 Registry Cache 层缓存）──
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
