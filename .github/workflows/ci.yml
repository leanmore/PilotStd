# PilotStd CI — 测试 + 版本管理 + Docker 镜像推送 ghcr.io
# 版本治理已原子化：version_bump job 负责写回三文件+打tag，build job 只读版本号
name: Docker CI
run-name: Docker | ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'pilotstd/**'
      - 'tests/**'
      - 'web/**'
      - 'docker/**'
      - 'requirements*.txt'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'docs/governance/**'
      - 'main.py'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      description:
        description: '运行描述（显示在 Actions 列表中）'
        required: false
        default: '手动触发'

concurrency:
  group: version-bump
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pilotstd
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 0: 版本号 bump（原子化——写回三个文件 + 打 tag）
  # ════════════════════════════════════════════════════════════════
  version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run bump_version.py
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python .github/scripts/bump_version.py --github --update "$COMMIT_MSG"
          NEW_VER=$(python -c "from pilotstd import __version__; print(__version__)")
          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VER" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VER"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pilotstd/__init__.py pyproject.toml web/package.json
          if git diff --cached --quiet; then
            echo "版本号未变更，跳过提交"
          else
            git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Create and push tag
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 已存在，跳过"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "已推送 git tag: $TAG"
          fi

  # ════════════════════════════════════════════════════════════════
  # Job 1: 后端测试
  # ════════════════════════════════════════════════════════════════
  test-backend:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install pytest pytest-xdist
          pip install -e .

      - name: Forbid production imports from test modules
        run: |
          if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then
            echo "❌ Production code imports test-only module. Abort."
            exit 1
          fi
          echo "✅ No forbidden imports found."

      - name: Run backend tests
        env:
          STANDARD_ROOT: /tmp/standards
        run: |
          mkdir -p /tmp/standards
          python -m pytest tests/ -q --tb=short -n auto \
            --deselect "tests/test_manager.py" \
            --deselect "tests/test_organizer.py" \
            --deselect "tests/test_core.py::TestFileUtils::test_safe_move_and_copy" \
            --deselect "tests/test_cli.py::TestCLIMove::test_cmd_move" \
            --deselect "tests/test_pipeline_router.py" \
            --deselect "tests/test_e2e_adapters.py"

      - name: Observability self-check
        run: python tests/test_observability.py --check-all

      - name: Governance documents validation
        run: |
          if grep -q "migrating" docs/governance/capabilities_registry.md; then
            echo "::error::Found entries with status 'migrating' in capabilities_registry.md"
            echo "Please resolve them before merging (migrate or deprecate)."
            exit 1
          fi
          echo "No migrating entries found — governance check passed."

      - name: Check dead Python code
        run: |
          pip install vulture
          vulture pilotstd/ docker/ tests/ scripts/ whitelist.py --min-confidence=80

      - name: GATE-08 — Check dependency completeness
        run: python scripts/check_dependencies.py

      - name: GATE-09 — Check CHANGELOG version consistency
        run: python scripts/check_changelog_version.py

  # ════════════════════════════════════════════════════════════════
  # Job 2: 安全扫描
  # ════════════════════════════════════════════════════════════════
  security-scan:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install bandit pip-audit

      - name: Run Bandit (static security analysis — 建议性)
        run: bandit -r pilotstd/ -f json -o bandit-report.json || echo "bandit found issues (non-blocking)"
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability scan — 建议性)
        run: pip-audit || echo "pip-audit found issues (non-blocking)"
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════
  # Job 3: 前端测试
  # ════════════════════════════════════════════════════════════════
  test-frontend:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and test
        run: |
          cd web
          npm ci
          npx vitest run

      - name: Check dead TypeScript exports
        run: |
          cd web
          npm install -D ts-prune
          npx ts-prune --error

      - name: GATE-10 — Check UI sensitive fields protection
        run: python scripts/gate_ui_sensitive_fields.py

  # ════════════════════════════════════════════════════════════════
  # Job 4: 构建 + 推送 Docker 镜像
  # ════════════════════════════════════════════════════════════════
  build-and-push:
    needs: [test-frontend, version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped') &&
      needs.test-frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 检出 version-bump 产出的 tag，确保镜像内版本号与标签一致
          ref: ${{ needs.version-bump.outputs.tag || github.ref }}

      # ── 版本号（由 version-bump job 产出）──
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ -n "${{ needs.version-bump.outputs.new_version }}" ]]; then
            VERSION="v${{ needs.version-bump.outputs.new_version }}"
          else
            VERSION=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$VERSION" ]; then
              echo "::error::无可用版本标签"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # ── 2a: 构建前端 ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Package dist.zip
        run: |
          cd web/dist
          zip -r ../../dist.zip .

      - name: Upload dist.zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist.zip
          retention-days: 1

      # ── 2b: 启用 Buildx（Registry Cache 必需）──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 2c: Docker 登录 ──
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 2d: 构建 + 推送（含 Registry Cache 层缓存）──
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ════════════════════════════════════════════════════════════════
  # Job 5: PyInstaller 编译 + GitHub Release（Windows）
  # ════════════════════════════════════════════════════════════════
  pyinstaller:
    needs: [version-bump]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ needs.version-bump.outputs.new_version }}" ]]; then
            VERSION="v${{ needs.version-bump.outputs.new_version }}"
          else
            VERSION=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Python: $(python --version)"
          if (-not (Test-Path data)) { New-Item -ItemType Directory data | Out-Null }
          $free = (Get-PSDrive -Name (Get-Location).Drive.Name).Free
          $free_gb = "{0:N1} GB" -f ($free / 1GB)
          if ($free -lt 3GB) {
            Write-Error "磁盘空间不足 (需要 ≥3GB，实际 $free_gb)"
            exit 1
          }
          pyinstaller PilotStd.spec --noconfirm
          $exe_path = "dist/PilotStd.exe"
          if (-not (Test-Path $exe_path)) {
            Write-Error "PyInstaller 产物缺失: $exe_path"
            exit 1
          }
          $exe_size_mb = "{0:N1} MB" -f ((Get-Item $exe_path).Length / 1MB)
          if ((Get-Item $exe_path).Length -lt 10MB) {
            Write-Error "PyInstaller 产物异常(过小): $exe_path ($exe_size_mb)"
            exit 1
          }
          Write-Host "产物: $exe_path ($exe_size_mb)"

      - name: Package to zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $zip_name = "PilotStd-$version.zip"
          Compress-Archive -Path "dist/PilotStd.exe" -DestinationPath $zip_name
          if (-not (Test-Path $zip_name)) {
            Write-Error "打包失败: $zip_name"
            exit 1
          }
          Write-Host "打包完成: $zip_name"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PilotStd-${{ steps.version.outputs.version }}
          path: PilotStd-${{ steps.version.outputs.version }}.zip
          retention-days: 7

      - name: Download dist.zip artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: PilotStd ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            ## PilotStd ${{ steps.version.outputs.version }}
            > 提交: ${{ github.sha }}
            PyInstaller 编译的 Windows 单文件版本。
            ### 系统要求
            - Windows 10/11 64-bit
            - 无需安装 Python
          files: PilotStd-${{ steps.version.outputs.version }}.zip

      - name: Upload dist.zip to release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f dist.zip ]; then
            gh release upload ${{ steps.version.outputs.version }} dist.zip --clobber
          else
            echo "dist.zip not found, skip upload (artifact may not be ready yet)"
          fi
