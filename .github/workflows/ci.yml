# PilotStd CI/CD — 统一流水线：测试 → 版本管理 → Docker + exe 构建
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_version:
        description: '手动指定版本号（如 1.0.0），留空则自动计算'
        required: false
        default: ''

# T-30 方案 G（R12-2，2026-09-27）：并发组**按 ref 拆分** + 开启 cancel-in-progress。
#   依据（R12-1 归因，78 run 全量）：全局单组 `ci-cd` + cancel-in-progress: false 使 **26/78 = 33%**
#   的 run 在创建时被前一个 run 挡住（等待中位 ≈300s、最长 1340s），而一次 run 中位时长 828s
#   （关键路径 test-gui-unit 467s）→ 连续推送必然互撞。按 ref 分组后：
#     ① 分支/PR 推送不再与 main 抢同一个槽位（原先共享全局组，会互相阻塞）；
#     ② 同一 ref 内取消被取代的旧 run → 新推送立即开跑（排队≈0），代价是该旧 run 无完整结论
#        （其提交会被下一次 run 的检出覆盖验证；本仓库 bump 提交不触发 workflow，无额外冲突）。
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pilotstd
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 0: Lint 快闸（T-30 方案 C，R12-3，2026-09-27）
  #   把 G-038（ruff+mypy+裸noqa）抽成独立轻量作业，并作为所有重作业的 `needs` 门控：
  #   lint 失败 → 下游作业**根本不启动**（失败 run 时长 828s → ~30~60s）。
  #   命令与范围与 repo-compliance 内的同名步骤完全一致（check_g_038_legacy_errors.py，零改动）；
  #   repo-compliance 内**保留**同名步骤作纵深防御（绿灯时多花 ~10s）。
  # ════════════════════════════════════════════════════════════════
  lint-fast:
    name: lint-fast (G-038)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: G-038 — 历史遗留错误清零（Ruff+Mypy+裸noqa）
        run: |
          pip install ruff mypy
          python scripts/check_g_038_legacy_errors.py

  # ════════════════════════════════════════════════════════════════
  # Job 1: 后端测试
  # ════════════════════════════════════════════════════════════════
  test-backend:
    needs: [lint-fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Forbid production imports from test modules
        run: |
          if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then
            echo "❌ Production code imports test-only module. Abort."
            exit 1
          fi
          echo "✅ No forbidden imports found."

      # ── Fail-Fast: Schema 一致性阻断 ──────────────────────────
      # 在运行 3000+ 测试之前先校验表结构，MISSING 列 → exit 1 阻断，
      # EXTRA 列仅警告不阻断。避免测试跑了 2 分钟后才发现 Schema 不一致。
      - name: Schema consistency check (blocking)
        run: python scripts/check_schema_consistency.py

      - name: Ruff check (blocking) — G-038
        run: |
          pip install ruff
          ruff check pilotstd/ docker/ tests/ scripts/ --output-format=github

      # ── CI Offline 硬阻断：禁止测试真实访问外部站点 ──────────────
      # 三层防护：iptables 硬阻断（主）→ 门禁脚本 fail-fast（验）→
      # tests/conftest.py 的 _ci_network_guard（进程内兜底）。
      # 注意：阻断链最后必须 -j REJECT/-j DROP 终结，跳转到空链等于没阻断；
      # 且只包住 pytest 一步，测试后立即恢复网络（见下方 Restore step），
      # 否则后续 vulture 安装 / 覆盖率上传等外网操作会被误伤。
      # 失败时把 stderr 注入 ::error:: annotation，便于在 check-run 中定位。
      - name: Block external network (CI offline)
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          echo "== probe =="
          whoami
          command -v iptables || echo "iptables MISSING"
          iptables --version 2>&1 || echo "version failed"
          sudo -n iptables -w -L -n >/dev/null 2>&1 && echo "access OK" || echo "access FAILED"
          echo "== block =="
          ipt() { sudo iptables -w "$@"; }
          if ! ipt -N PILOTSTD_BLOCK 2>/tmp/ipt_n.txt; then
            echo "::error::[-N PILOTSTD_BLOCK] $(cat /tmp/ipt_n.txt)"
            exit 1
          fi
          # REJECT 不带 --reject-with：nf_tables 后端不支持 tcp-reset（CI-FIX-20260820-001）
          for cmd in \
            "-F PILOTSTD_BLOCK" \
            "-A PILOTSTD_BLOCK -o lo -j ACCEPT" \
            "-A PILOTSTD_BLOCK -m state --state ESTABLISHED,RELATED -j ACCEPT" \
            "-A PILOTSTD_BLOCK -p udp --dport 53 -j ACCEPT" \
            "-A PILOTSTD_BLOCK -j REJECT" \
            "-A OUTPUT -j PILOTSTD_BLOCK"
          do
            if ! ipt $cmd 2>/tmp/ipt_e.txt; then
              echo "::error::iptables $cmd FAILED: $(cat /tmp/ipt_e.txt)"
              exit 1
            fi
          done
          ipt -S PILOTSTD_BLOCK
          echo "🔒 External network blocked except localhost"

      - name: Verify offline gate (fail-fast before 3000+ tests)
        if: runner.os == 'Linux'
        run: python scripts/check_ci_offline.py

      # T-28（R12-2）：加 `-rs` —— 让 CI 日志给出跳过明细（原先只有汇总行 `N skipped`，
      #   44 处跳过的位置与原因在 CI 侧不可得）。xdist（-n auto）下各 worker 会各自打印短摘要，
      #   汇总可能分段；如需机器可读清单，用 `python tests/skip_census.py <日志> --json` 解析。
      - name: Run backend tests
        env:
          STANDARD_ROOT: /tmp/standards
          SUPERUSER: superadmin
          ADMIN_USERNAME: superadmin
        run: |
          mkdir -p /tmp/standards
          python -m pytest tests/ -q -rs --tb=short -n auto -p no:pytest-qt \
            --cov=pilotstd --cov-fail-under=45 \
            --timeout=60 --timeout_method=signal \
            --ignore=tests/gui/ \
            --ignore=tests/test_regression_architecture.py \
            --ignore-glob="*test_ui*.py" \
            --ignore=tests/test_scan_misc.py \
            --ignore=tests/test_groups23_remaining.py \
            --ignore=tests/test_last_push.py \
            --ignore=tests/test_unified_progress.py \
            --ignore=tests/test_platform_notify.py \
            --ignore=tests/test_monitor.py \
            --ignore=tests/test_query.py \
            --deselect "tests/test_core.py::TestFileUtils::test_safe_move_and_copy" \
            --deselect "tests/test_cli.py::TestCLIMove::test_cmd_move" \
            --ignore=tests/test_ci_scan_fix.py

      # 恢复网络：即使 pytest 失败也必须执行（if: always()），
      # 否则后续 vulture 安装 / 覆盖率上传等步骤会被阻断。
      - name: Restore network (always)
        if: always()
        run: |
          sudo iptables -w -D OUTPUT -j PILOTSTD_BLOCK 2>/dev/null || true
          sudo iptables -w -F PILOTSTD_BLOCK 2>/dev/null || true
          sudo iptables -w -X PILOTSTD_BLOCK 2>/dev/null || true
          echo "🌐 Network restored"

      - name: Observability self-check
        run: python tests/test_observability.py --check-all

      - name: Governance documents validation
        run: |
          if grep -q "migrating" docs/governance/capabilities_registry.md; then
            echo "::error::Found entries with status 'migrating' in capabilities_registry.md"
            echo "Please resolve them before merging (migrate or deprecate)."
            exit 1
          fi
          echo "No migrating entries found — governance check passed."

      - name: Check dead Python code
        run: |
          pip install vulture
          vulture pilotstd/ docker/ tests/ scripts/ whitelist.py --min-confidence=100

      - name: Compile check — ui/core/
        run: python -m compileall -f pilotstd/ui/core/

      - name: G-008 — Check dependency completeness
        run: python scripts/check_dependencies.py

      - name: G-009 — Check CHANGELOG version consistency
        run: python scripts/check_changelog_version.py

      - name: G-010 — 代码规模控制 (阻断模式)
        run: python scripts/check_g_010_code_size.py

      - name: G-011 — 动态属性完整性检查
        run: python scripts/check_g_011_attr_integrity.py

      - name: G-025 — 适配器列表一致性
        run: python scripts/check_g_025_adapters.py

      - name: G-028 — 禁止硬编码 admin
        run: python scripts/check_g_028_no_hardcoded_admin.py

      # 2026-09-26 起因：一次合并提交带着冲突标记通过了全部门禁
      - name: G-039 — 禁止合并冲突标记
        run: python scripts/check_no_conflict_markers.py

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data
          path: .coverage
          retention-days: 1
          include-hidden-files: true

  # ════════════════════════════════════════════════════════════════
  # Job 1b: Linux GUI 覆盖率补充（xvfb + artifact 传递）
  # ════════════════════════════════════════════════════════════════
  test-gui-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-fast, test-backend]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies for PyQt6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            xvfb

      - name: Download backend coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-data
          path: .

      - name: Install Python dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install PyQt6
          pip install pytest pytest-qt pytest-cov pytest-timeout responses respx
          pip install -e .

      - name: Verify worker fix and clean pyc
        run: |
          echo "=== Verifying finished_signal.emit in workers ==="
          grep -n "finished_signal.emit" pilotstd/ui/workers/scan.py pilotstd/ui/workers/download.py pilotstd/ui/workers/normalize.py pilotstd/ui/workers/archive.py pilotstd/ui/workers/query.py pilotstd/ui/workers/auto.py || echo "WARNING: Worker fix not found!"
          echo "=== Cleaning pycache ==="
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          echo "=== Removing stale workers.py (if any) ==="
          find . -path "*/workers/workers.py" -delete 2>/dev/null || true

      - name: Run GUI tests with xvfb
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python -m pytest tests/gui/ -rs \
              --cov=pilotstd --cov-append \
              --timeout=60 --timeout_method=signal \
              -v --tb=long -p no:warnings

      - name: Report coverage delta
        run: |
          python -m coverage report --show-missing

      - name: Upload merged coverage data
        uses: actions/upload-artifact@v6
        with:
          name: gui-coverage-merged
          path: .coverage
          retention-days: 30
          include-hidden-files: true

  # ════════════════════════════════════════════════════════════════
  # Job 1c: E2E 覆盖率基线（与 test-backend 并行，不阻塞）
  # ════════════════════════════════════════════════════════════════
  e2e-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-fast]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install pytest pytest-cov pytest-timeout responses respx pytest-httpserver
          pip install -e .

      - name: Run E2E with coverage
        env:
          COVERAGE_FILE: .coverage.e2e
          PYTEST_RUNNING_MODE: e2e
        run: |
          mkdir -p /tmp/standards
          python -m pytest tests/e2e/ -rs \
            --import-mode=importlib \
            --cov=pilotstd \
            --cov-report=xml:e2e-coverage.xml \
            --cov-report=html:htmlcov/e2e \
            --cov-fail-under=0 \
            -q

      - name: Upload E2E coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: e2e-coverage-report
          path: |
            e2e-coverage.xml
            htmlcov/e2e/
          retention-days: 30

  # ════════════════════════════════════════════════════════════════
  # Job 2: 安全扫描
  # ════════════════════════════════════════════════════════════════
  security-scan:
    needs: [lint-fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install bandit pip-audit detect-secrets

      - name: Run detect-secrets (凭证泄漏扫描)
        run: detect-secrets-hook --baseline .secrets.baseline

      - name: Run Bandit (static security analysis — 建议性)
        run: bandit -r pilotstd/ -f json -o bandit-report.json || echo "bandit found issues (non-blocking)"
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability scan — 建议性)
        run: pip-audit || echo "pip-audit found issues (non-blocking)"
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════
  # Job 3: 前端测试
  # ════════════════════════════════════════════════════════════════
  test-frontend:
    needs: [lint-fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd web
          rm -rf node_modules/.vite
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: |
          cd web
          pnpm run type-check

      - name: PrimeVue icon import check
        run: bash scripts/check-primevue-icons.sh

      - name: Run tests
        run: |
          cd web
          pnpm run test

      - name: Check dead TypeScript exports
        run: |
          cd web
          pnpm add -D ts-prune
          pnpm ts-prune --error

      - name: G-018 — Check UI sensitive fields protection
        run: python scripts/check_ui_sensitive_fields.py

      - name: G-027 — Vue 组件 defineOptions 检查
        run: python scripts/check_g_027_define_options.py

      - name: i18n key count & alignment check
        run: python scripts/check_i18n_key_count.py

      - name: G-040 — i18n 硬编码检查（组件里不得新写死中文，只拦新增）
        run: python scripts/check_i18n_hardcoded.py

      - name: G-047 — Python 侧 i18n 硬编码检查（AST 字面量口径，只拦新增）
        # 与 G-040 互补：G-040 只扫 web/src/**/*.{vue,ts}，本步覆盖 pilotstd/ 与 docker/。
        run: python scripts/check_i18n_hardcoded_python.py

      - name: G-043 — 敏感端点审计接线（凭证/权限/批量销毁端点必须有 write_audit）
        run: python scripts/check_sensitive_endpoint_audit.py

      - name: G-044 — 术语与禁用词检查（notification.* 术语一致 + 禁用词）
        run: python scripts/check_terminology.py

      - name: G-045 — 通知系统覆盖度基线（i18n / e2e / 审计三维度 + trigger_file 存在性）
        run: python scripts/audit_notification_coverage.py

      - name: G-046 — 通知链路审计（吞错 / 空文本风险 / 缺空值守卫）
        # L-08 接入：判定逻辑修复后问题数由 79 归零，故可零基线接入（不设静默基线）。
        run: python scripts/audit_notification_chain.py --strict

  # ════════════════════════════════════════════════════════════════
  # Job 4: GUI E2E 测试（Windows，依赖 PyQt6，允许重试）
  # ════════════════════════════════════════════════════════════════
  test-e2e:
    needs: [lint-fast]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: desktop/requirements-win.txt

      - name: Install dependencies
        run: |
          pip install -r desktop/requirements-win.txt
          pip install pytest pytest-qt pytest-rerunfailures

      - name: Run E2E tests
        shell: pwsh
        env:
          SUPERUSER: superadmin
        run: python -m pytest tests/gui/ -m e2e -rs -v --maxfail=1 --tb=short --reruns 3 --reruns-delay 2

  # ════════════════════════════════════════════════════════════════
  # Job 4b: 前端 E2E 回归测试（Playwright，依赖前端 Lint 通过）
  # ════════════════════════════════════════════════════════════════
  frontend-e2e:
    name: frontend-e2e
    runs-on: ubuntu-24.04
    needs: [lint-fast, test-frontend]
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: leanmore/pilotstd
      PYTHON_VERSION: "3.12"
      NODE_VERSION: "22"
      SUPERUSER: superadmin
      ADMIN_PASSWORD: Admin@123
      PILOTSTD_STORAGE_INBOX_DIR: /tmp/pilotstd-inbox
      STANDARD_ROOT: /tmp/pilotstd-lib
      BACKEND_PORT: "9028"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r docker/requirements-docker.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # Step 1: 确保端口空闲（必须在启动 backend 之前执行）
      - name: Ensure port 9028 is free
        run: |
          set -euo pipefail
          # 先尝试优雅终止
          lsof -ti:${{ env.BACKEND_PORT }} | xargs kill -9 2>/dev/null || true
          sleep 1

          # 等待端口完全释放
          for i in $(seq 1 10); do
            if ! ss -tlnp | grep -q ':${{ env.BACKEND_PORT }} '; then
              echo "✅ Port ${{ env.BACKEND_PORT }} is free"
              exit 0
            fi
            echo "Port ${{ env.BACKEND_PORT }} still occupied, waiting... ($i/10)"
            sleep 2
          done

          # 兜底强制清理
          echo "Force killing remaining process on port ${{ env.BACKEND_PORT }}..."
          fuser -k ${{ env.BACKEND_PORT }}/tcp 2>/dev/null || true
          sleep 1

          # 最终确认
          if ss -tlnp | grep -q ':${{ env.BACKEND_PORT }} '; then
            echo "❌ Port ${{ env.BACKEND_PORT }} still occupied after force kill"
            exit 1
          fi
          echo "✅ Port ${{ env.BACKEND_PORT }} is free (after force kill)"

      # Step 2: 启动 backend（不再包含端口检查逻辑）
      - name: Start backend
        run: |
          set -euo pipefail
          mkdir -p "$PILOTSTD_STORAGE_INBOX_DIR" "$STANDARD_ROOT"

          uvicorn docker.app:app --host 0.0.0.0 --port ${{ env.BACKEND_PORT }} > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"

          sleep 3

          if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
            echo "❌ Backend exited prematurely"
            echo "=== Backend startup log ==="
            cat /tmp/backend.log
            exit 1
          fi
          echo "✅ Backend is running (PID: $BACKEND_PID)"

      # Step 3: 健康检查（backend 存活期间执行，不会被误杀）
      - name: Wait for backend healthy
        run: |
          set -euo pipefail
          ENDPOINTS=("/api/health" "/docs" "/openapi.json" "/")

          for i in $(seq 1 30); do
            for endpoint in "${ENDPOINTS[@]}"; do
              if curl -sf "http://localhost:${{ env.BACKEND_PORT }}${endpoint}" >/dev/null 2>&1; then
                echo "✅ Backend healthy on endpoint: ${endpoint}"
                exit 0
              fi
            done
            echo "Waiting for backend on port ${{ env.BACKEND_PORT }}... ($i/30)"
            sleep 2
          done

          echo "❌ Backend not healthy after 60s"
          echo "Tried endpoints: ${ENDPOINTS[*]}"
          echo "=== Backend log at timeout ==="
          cat /tmp/backend.log || echo "(no log file found)"
          curl -v "http://localhost:${{ env.BACKEND_PORT }}/" || true
          exit 1

      # Step 2b: Seed admin 测试用户（CI 环境默认为 superadmin，需补建 admin 供 E2E 使用）
      - name: Initialize test admin user
        run: |
          set -euo pipefail
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          os.environ.setdefault('SUPERUSER', '${{ env.SUPERUSER }}')
          from pilotstd.core.db import Database
          from pilotstd.core.config import get_db_path
          from pilotstd.core.security import get_password_hash, generate_salt
          from docker.users import init_users_table
          init_users_table()
          db = Database(get_db_path())
          # UPSERT: ON CONFLICT DO UPDATE 确保密码哈希始终与当前代码一致
          db.execute(
              'INSERT INTO users (username, password_hash, salt, role) VALUES (?, ?, ?, ?) '
              'ON CONFLICT(username) DO UPDATE SET '
              'password_hash=excluded.password_hash, '
              'salt=excluded.salt, '
              'role=excluded.role',
              ('admin', get_password_hash('Admin@123'), generate_salt(), 'admin'),
          )
          db.execute(
              'INSERT INTO users (username, password_hash, salt, role) VALUES (?, ?, ?, ?) '
              'ON CONFLICT(username) DO UPDATE SET '
              'password_hash=excluded.password_hash, '
              'salt=excluded.salt, '
              'role=excluded.role',
              ('user', get_password_hash('User@123'), generate_salt(), 'user'),
          )
          print('✅ Admin and user upserted')
          db.close()
          "

      # Step 2c: 验证 admin 用户可登录（seed 后确认哈希匹配）
      # 注意：登录端点为 /api/login（Form 数据，非 JSON）
      - name: Verify admin login works
        run: |
          set -euo pipefail
          sleep 2
          RESP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:${{ env.BACKEND_PORT }}/api/login \
            -F "username=admin" \
            -F "password=Admin@123")
          echo "Login verification status: $RESP"
          if [ "$RESP" != "200" ]; then
            echo "❌ Seed admin cannot login! Hash mismatch suspected."
            curl -s -X POST http://localhost:${{ env.BACKEND_PORT }}/api/login \
              -F "username=admin" \
              -F "password=Admin@123"
            exit 1
          fi
          echo "✅ Admin login verified"

      # Step 4: 启动前端 dev server（proxy 目标通过 VITE_API_TARGET 指向本地 backend）
      - name: Start frontend dev server
        env:
          VITE_API_TARGET: http://localhost:${{ env.BACKEND_PORT }}
        run: |
          set -euo pipefail
          cd web
          nohup pnpm dev -- --host 0.0.0.0 --port 5173 > /tmp/frontend.log 2>&1 &
          FRONTEND_PID=$!
          echo "Frontend PID: $FRONTEND_PID"

          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 >/dev/null 2>&1; then
              echo "✅ Frontend ready (PID: $FRONTEND_PID)"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done

          echo "❌ Frontend failed to start after 60s"
          echo "=== Frontend log ==="
          cat /tmp/frontend.log || echo "(no log)"
          exit 1

      # Step 5: 运行 E2E 测试
      - name: Run Playwright E2E tests
        working-directory: web
        env:
          VITE_API_BASE_URL: http://localhost:${{ env.BACKEND_PORT }}
        run: pnpm exec playwright test e2e/dashboard/quick-actions.spec.ts

      # Step 6: 上传测试报告（即使失败也执行）
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      # Step 7: 清理 backend + frontend 进程
      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/backend.log || echo "No backend log found"

      - name: Cleanup backend and frontend
        if: always()
        run: |
          kill $(lsof -t -i:${{ env.BACKEND_PORT }}) 2>/dev/null || true
          pkill -f "pnpm dev" 2>/dev/null || true
          echo "Cleanup completed"

  # ════════════════════════════════════════════════════════════════
  # Job 5: GUI 单元测试 + Handler 覆盖率（Windows）
  # ════════════════════════════════════════════════════════════════
  test-gui-unit:
    needs: [lint-fast]
    runs-on: windows-latest
    # G-CI-003: 985 tests ≈ 18min on windows-2025-vs2026, 25min with safety margin
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: desktop/requirements-win.txt

      - name: Install dependencies
        run: |
          pip install -r desktop/requirements-win.txt
          pip install -r requirements-dev.txt

      - name: Run GUI unit tests
        shell: pwsh
        env:
          SUPERUSER: superadmin
          PILOTSTD_GUI_TEST: "1"
        run: |
          python -m pytest tests/gui/ tests/test_regression_architecture.py -rs `
            -v --tb=short `
            --cov=pilotstd/ui/core/handlers/ `
            --ignore-glob="*test_e2e*.py"

      # ── 失败语义分离：仅当测试通过时才检查覆盖率 ──────────────
      # 测试红 = 改代码；覆盖率红 = 补测试。不再混淆。
      - name: Tests passed — checking coverage thresholds
        if: success()
        shell: pwsh
        run: |
          echo "=== Engine layer (core business logic) >=95% ==="
          python -m coverage report `
            --include="pilotstd/ui/core/handlers/*_flow_engine.py" `
            --fail-under=95 `
            --skip-empty

          echo "=== Handler glue layer (Qt adapters) >=20% ==="
          python -m coverage report `
            --include="pilotstd/ui/core/handlers/*.py" `
            --omit="pilotstd/ui/core/handlers/*_flow_engine.py" `
            --fail-under=20 `
            --skip-empty

          echo "=== Overall (macro health) >=58% ==="
          # TODO(P2): restore to 68 after UI handler tests are added
          python -m coverage report --fail-under=58

  # ════════════════════════════════════════════════════════════════
  # Job 5: 入仓合规检查
  # ════════════════════════════════════════════════════════════════
  repo-compliance:
    needs: [lint-fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # T-24 L3（R11-5，2026-09-27）：G-038（ruff+mypy）由本作业**末位前移到最前端**（紧跟 checkout）。
      #   实测 11 次 run：本步骤原在作业内 +13s 完成（其前面 10 个步骤合计仅 ~3s），前移后 ≈ +12s
      #   ——**顺序收益约 1s**；真正主导暴露时间的是 runner 排队（11 次中位 154s、最长 471s，源于全局
      #   并发组 ci-cd 串行，见主簿「六、观察项」T-30）。对照组：test-backend 的 Ruff 步骤作业内
      #   +30~34s（其前置 Install dependencies 独占 23~29s）。前移的实质收益＝让 lint 成为作业内**首个**
      #   信号、不再排在其他 10 个检查之后；检查逻辑、命令、范围一字未改。
      - name: G-038 — 历史遗留错误清零（Ruff+Mypy+裸noqa）
        run: |
          pip install ruff mypy
          python scripts/check_g_038_legacy_errors.py

      - name: Run repo compliance check
        env:
          BASE_BRANCH: main
          # T-27（R14-1，2026-10-01）：与 docs-sync（T-25/R11-3b）同一手法——推送路径上
          #   `origin/main` 已被推进到本次 tip，脚本内 `origin/main..HEAD` 恒空 → 恒 PASS（假绿）。
          #   故显式传本次推送范围；push 载荷专用字段是 `github.event.before`，右端用通用的 `github.sha`。
          COMPLIANCE_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: bash .github/scripts/check-repo-compliance.sh

      - name: G-026 — Docker 挂载黑名单
        run: python scripts/check_g_026_docker_mounts.py

      - name: G-029 — 核心模块变更测试同步检查
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
        run: python scripts/check_g_029_test_coverage.py

      # T-16 / T-25（2026-09-27 第十轮 + 第十一轮）：本步骤必须跑**两个形近脚本**，缺一即形成盲区——
      #   docs_sync_check.py：8 条触发规则 + 严格模式（告警期 exit 0；--strict-block 才阻断）
      #   check_module_doc_mappings.py：5 条「核心模块 → 架构文档」映射（**比 G-031 更宽**：含 pilotstd/query/、pilotstd/ui/）
#     改名（R16，P1）：原名 check_docs_sync.py 与 docs_sync_check.py 仅差 check_ 前缀 → 曾导致接线事故（T-25）
      # 事故回指（T-25）：第十轮本步骤被误写成只跑当时的 check_docs_sync.py（现名 check_module_doc_mappings.py），而它当时只做 origin/<base>..HEAD
      #   （推送到 main 时恒为空、浅克隆下甚至取不到）→ 步骤长期空转、`[docs-compliance] PASS: 无变更文件`，
      #   导致 T-16 的 6 次「告警期观察」全部无效。两者现均支持 --range / DOCS_SYNC_RANGE 回退链。
      # R11-3b 补丁（第五个 CI 盲区：范围取值陷阱）——右端必须用 `github.sha`（通用上下文，push 时即本次推送 tip；
      #   push 载荷**没有** `event.sha` 字段，push 专有字段是 `github.event.after`）。原写法展开为空串
      #   → `DOCS_SYNC_RANGE=<before>..` → 两脚本判为非法 → 回退 `origin/main...HEAD`；而同一作业更早的
      #   `check-repo-compliance.sh` 执行过 `git fetch origin main --depth=1`，把仓库变成**浅克隆**（.git/shallow
      #   边界落在 tip），于是 `origin/main...HEAD` 恒空、`HEAD~1..HEAD` 也不可用（实测 `fatal: Needed a single revision`）
      #   → 步骤以「无变更文件」空转（run 36304263963 / 36306033918 实证）。显式范围 `<before>..<sha>` 不受浅边界影响
      #   （两端对象都在本地，实测 8 个文件）。
      # 当前两者均为**告警期**：发现未同步只打 `WARN(告警期)` 并 exit 0（绝不静默 PASS）；
      # 观察若干次后把对应脚本的 --strict 改为 --strict-block 即开启阻断。
      - name: Docs sync check
        env:
          AUTO_FIX_DOCS: "false"
          DOCS_SYNC_RANGE: ${{ github.event.before }}..${{ github.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          set -e
          python scripts/docs_sync_check.py --strict
          python scripts/check_module_doc_mappings.py --strict

      # 能力矩阵是入库文档（docs/governance/capabilities_registry.md）：
      # 重生成后与入库内容比对，有实质差异即阻断（忽略生成时间戳行）。
      # 生成动作本身属本地行为，此处只做"入库内容是否与代码一致"的校验。
      - name: Capabilities sync check — 能力矩阵与代码一致
        run: python scripts/check_capabilities_sync.py

      # ── 深门禁补齐：直推 main 时 G-030/G-032/G-033/G-037/G-038 ──
      # 原先仅 trinity-gate（PR 触发 + 手动）执行；本仓库以直推 main 为主，
      # 故在此统一部署，保证 push 流水线也有完整门禁覆盖（2026-08-20）。
      - name: G-030 — 技术债联动检查
        run: python scripts/check_g_030_tech_debt.py

      - name: G-032 — 文档健康度守护
        run: python scripts/check_g_032_doc_health.py

      - name: G-033 — ADR 完整性检查
        run: python scripts/check_g_033_adr_integrity.py

      - name: G-037 — 触发条件对齐检查
        run: python scripts/check_g_037_trigger_alignment.py

      # G-015 相对导入有效性：纯静态 AST 扫描，无网络请求，
      # 不受 CI 离线阻断影响；直推 main 时拦截无效相对导入。
      - name: G-015 — 相对导入检查
        run: python scripts/check_g_015_relative_imports.py

  # ════════════════════════════════════════════════════════════════
  # Job 5: 版本管理（测试全部通过后执行）
  # ════════════════════════════════════════════════════════════════
  version:
    needs: [test-backend, test-frontend, security-scan, repo-compliance, test-e2e, test-gui-unit, test-gui-coverage, frontend-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get latest tag as base version
        id: base
        run: |
          # 以 Git Tag 为唯一事实来源，解决跨端版本号对齐问题
          BASE_VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "base_version=$BASE_VER" >> $GITHUB_OUTPUT

      - name: Get commit messages since last tag
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            MSGS=$(git log ${LAST_TAG}..HEAD --format=%s | tr '\n' '|')
          else
            MSGS=$(git log --format=%s | tr '\n' '|')
          fi
          echo "messages=${MSGS//'%'/'%25'}" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        env:
          BASE_VERSION: ${{ steps.base.outputs.base_version }}
          COMMIT_MSGS: ${{ steps.commits.outputs.messages }}
        run: |
          OVERRIDE="${{ github.event.inputs.override_version }}"

          if [ -n "$OVERRIDE" ]; then
            NEW_VER="$OVERRIDE"
          else
            NEW_VER=$(python scripts/version.py)
          fi

          if [ -n "$NEW_VER" ] && [ "$NEW_VER" != "${{ steps.base.outputs.base_version }}" ]; then
            echo "version=$NEW_VER" >> $GITHUB_OUTPUT
            echo "bumped=true" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.base.outputs.base_version }}" >> $GITHUB_OUTPUT
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit version bump
        if: steps.bump.outputs.bumped == 'true'
        run: |
          TARGET_VER="${{ steps.bump.outputs.version }}"
          CURRENT_VER=$(cat VERSION 2>/dev/null || echo "")

          # 防重：若 VERSION 已为目标值则跳过（前一个 CI 已完成 bump）
          if [ "$CURRENT_VER" = "$TARGET_VER" ]; then
            echo "VERSION already at $TARGET_VER, commit skipped"
            exit 0
          fi

          # 1. 更新 VERSION 文件
          echo "$TARGET_VER" > VERSION

          # 2. 精准替换 pilotstd/__init__.py 第 10 行的 __version__
          sed -i "10s/__version__ = .*/__version__ = \"$TARGET_VER\"/" pilotstd/__init__.py

          # 3. 同步 CHANGELOG（在 # CHANGELOG 行后插入新版本条目）
          export V="$TARGET_VER"
          export DATE=$(date +%Y-%m-%d)
          python3 << 'PYEOF'
          import os
          v = os.environ["V"]
          date = os.environ["DATE"]
          with open("CHANGELOG.md", "r") as f:
              content = f.read()
          entry = f"## v{v} ({date})\n\n### Fixed\n- 版本号自动同步（CI 更新）\n\n"
          idx = content.index("\n") + 1
          content = content[:idx] + entry + content[idx:]
          with open("CHANGELOG.md", "w") as f:
              f.write(content)
          PYEOF

          # 4. 统一提交并推送（防竞态：fetch+rebase 后重试，最多 3 次）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION pilotstd/__init__.py CHANGELOG.md
          git commit -m "chore: bump version to v$TARGET_VER" || { echo "Nothing to commit, skipped"; exit 0; }
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push attempt $i failed, fetching and retrying..."
            git pull --rebase origin main
            # 解决 CHANGELOG.md 可能产生的冲突：清除冲突标记保留内容
            if [ -f CHANGELOG.md ] && git diff --name-only --diff-filter=U | grep -q CHANGELOG.md; then
              python3 -c "import re; c=open('CHANGELOG.md').read(); open('CHANGELOG.md','w').write(re.sub(r'<<<<<<<[^\n]*\n|=======\n|>>>>>>>[^\n]*\n','',c))"
              git add CHANGELOG.md
              GIT_EDITOR=true git rebase --continue 2>/dev/null || true
            fi
            sleep 2
          done
          # 防冲突：等待 push 完成后再打 tag
          sleep 2

      - name: Create and push tag
        if: steps.bump.outputs.bumped == 'true'
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag $TAG already exists on remote, skipping creation"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  # ════════════════════════════════════════════════════════════════
  # Job 6: Docker 镜像构建
  # ════════════════════════════════════════════════════════════════
  docker:
    name: docker
    needs: version
    if: github.ref == 'refs/heads/main' && needs.version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # APP_VERSION 必须取"实际被检出的提交"，而非触发工作流的推送提交（github.sha）：
      # version job 已把版本号 bump 提交推上 main，此处 ref: main 检出的是 bump 之后的提交，
      # 两者不一致会让 /api/health 报出的 sha 与镜像内 __version__ 对不上（实测 v0.108.0 镜像报 97fabf48）。
      - name: Resolve built revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Build frontend
        env:
          VITE_SUPERUSER_USERNAME: superadmin
        run: |
          cd web
          rm -rf node_modules/.vite
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          build-args: |
            APP_VERSION=${{ steps.rev.outputs.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.rev.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}

  # ════════════════════════════════════════════════════════════════
  # Job 7: exe 构建
  # ════════════════════════════════════════════════════════════════
  exe:
    name: exe
    needs: version
    if: github.ref == 'refs/heads/main' && needs.version.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: desktop/requirements-win.txt

      - name: Install dependencies
        run: |
          pip install -r desktop/requirements-win.txt
          pip install pyinstaller

      - name: Create data directory if not exists
        run: |
          if not exist data mkdir data
        shell: cmd

      - name: Build exe with PyInstaller
        run: pyinstaller desktop/PilotStd.spec --noconfirm --clean

      - name: Upload exe to Release
        if: needs.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: PilotStd v${{ needs.version.outputs.version }}
          make_latest: true
          files: dist/PilotStd.exe
          body: |
            ## PilotStd v${{ needs.version.outputs.version }}
            > 提交: ${{ github.sha }}

            PyInstaller 编译的 Windows 单文件版本。

            ### 系统要求
            - Windows 10/11 64-bit
            - 无需安装 Python
