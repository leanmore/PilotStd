# PilotStd CI — 测试 + 版本管理 + Docker 镜像推送 ghcr.io
# 版本治理已原子化：version_bump job 负责写回三文件+打tag，build job 只读版本号
name: Docker CI
run-name: Docker | ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'pilotstd/**'
      - 'tests/**'
      - 'web/**'
      - 'docker/**'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - '.pre-commit-config.yaml'
      - '.secrets.baseline'
      - 'docs/governance/**'
      - 'scripts/**'
      - 'main.py'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      description:
        description: '运行描述（显示在 Actions 列表中）'
        required: false
        default: '手动触发'

concurrency:
  group: version-bump
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pilotstd
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 0: 版本号 bump（原子化——写回三个文件 + 打 tag）
  # ════════════════════════════════════════════════════════════════
  version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run bump_version.py
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python .github/scripts/bump_version.py --github --update "$COMMIT_MSG"
          NEW_VER=$(python -c "from pilotstd import __version__; print(__version__)")
          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VER" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VER"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pilotstd/__init__.py pyproject.toml web/package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "版本号未变更，跳过提交"
          else
            git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }}"
            git pull --rebase origin main
            git push
          fi

      - name: Create and push tag
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 已存在，跳过"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "已推送 git tag: $TAG"
          fi

      - name: Trigger desktop build
        if: steps.bump.outputs.bumped == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-desktop.yml/dispatches" \
            -d '{"ref":"v${{ steps.bump.outputs.new_version }}"}'
          echo "已触发桌面端构建: v${{ steps.bump.outputs.new_version }}"

  # ════════════════════════════════════════════════════════════════
  # Job 1: 后端测试
  # ════════════════════════════════════════════════════════════════
  test-backend:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install pytest pytest-xdist
          pip install -e .

      - name: Forbid production imports from test modules
        run: |
          if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then
            echo "❌ Production code imports test-only module. Abort."
            exit 1
          fi
          echo "✅ No forbidden imports found."

      - name: Run backend tests
        env:
          STANDARD_ROOT: /tmp/standards
          SUPERUSER: superadmin
          ADMIN_USERNAME: superadmin
        run: |
          mkdir -p /tmp/standards
          python -m pytest tests/ -q --tb=short -n auto \
            --deselect "tests/test_manager.py" \
            --deselect "tests/test_organizer.py" \
            --deselect "tests/test_core.py::TestFileUtils::test_safe_move_and_copy" \
            --deselect "tests/test_cli.py::TestCLIMove::test_cmd_move" \
            --deselect "tests/test_pipeline_router.py" \
            --deselect "tests/test_e2e_adapters.py"

      - name: Observability self-check
        run: python tests/test_observability.py --check-all

      - name: Governance documents validation
        run: |
          if grep -q "migrating" docs/governance/capabilities_registry.md; then
            echo "::error::Found entries with status 'migrating' in capabilities_registry.md"
            echo "Please resolve them before merging (migrate or deprecate)."
            exit 1
          fi
          echo "No migrating entries found — governance check passed."

      - name: Check dead Python code
        run: |
          pip install vulture
          vulture pilotstd/ docker/ tests/ scripts/ whitelist.py --min-confidence=80

      - name: GATE-08 — Check dependency completeness
        run: python scripts/check_dependencies.py

      - name: GATE-09 — Check CHANGELOG version consistency
        run: python scripts/check_changelog_version.py

      - name: GATE-15 — 代码规模控制 (阻断模式)
        run: python scripts/check_gate_15_code_size.py

      - name: GATE-16 — 动态属性完整性检查
        run: python scripts/check_gate_16_attr_integrity.py

  # ════════════════════════════════════════════════════════════════
  # Job 2: 安全扫描
  # ════════════════════════════════════════════════════════════════
  security-scan:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install bandit pip-audit detect-secrets

      - name: Run detect-secrets (凭证泄漏扫描)
        run: detect-secrets-hook --baseline .secrets.baseline

      - name: Run Bandit (static security analysis — 建议性)
        run: bandit -r pilotstd/ -f json -o bandit-report.json || echo "bandit found issues (non-blocking)"
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability scan — 建议性)
        run: pip-audit || echo "pip-audit found issues (non-blocking)"
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════
  # Job 3: 前端测试
  # ════════════════════════════════════════════════════════════════
  test-frontend:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: |
          cd web
          pnpm run type-check

      - name: Run tests
        run: |
          cd web
          pnpm run test

      - name: Check dead TypeScript exports
        run: |
          cd web
          pnpm add -D ts-prune
          pnpm ts-prune --error

      - name: GATE-10 — Check UI sensitive fields protection
        run: python scripts/check_ui_sensitive_fields.py

  # ════════════════════════════════════════════════════════════════
  # Job 3.5: 入仓合规检查
  # ════════════════════════════════════════════════════════════════
  repo-compliance:
    needs: [version-bump]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repo compliance check
        env:
          BASE_BRANCH: main
        run: bash .github/scripts/check-repo-compliance.sh

  # ════════════════════════════════════════════════════════════════
  # Job 4: 构建 + 推送 Docker 镜像
  # ════════════════════════════════════════════════════════════════
  build-and-push:
    needs: [test-backend, test-frontend, version-bump, repo-compliance]
    if: |
      always() &&
      (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped') &&
      needs.test-backend.result == 'success' &&
      needs.test-frontend.result == 'success' &&
      (needs.repo-compliance.result == 'success' || needs.repo-compliance.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 版本号（多源回退：tag > version-bump 产出 > git describe）──
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ -n "${{ needs.version-bump.outputs.new_version }}" ]]; then
            VERSION="v${{ needs.version-bump.outputs.new_version }}"
          else
            VERSION=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$VERSION" ]; then
              echo "::error::无可用版本标签"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # ── 2a: 构建前端 ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Build frontend
        run: |
          npm install -g pnpm
          cd web
          rm -rf node_modules/.vite
          rm -rf dist
          rm -rf node_modules
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Package dist.zip
        run: |
          cd web/dist
          zip -r ../../dist.zip .

      - name: Verify dist.zip contents
        run: |
          echo "=== dist.zip 内容验证 ==="
          unzip -l dist.zip | head -30
          echo "=== 检查关键文件是否包含最新代码 ==="
          # 验证 dist.zip 包含最新的前端代码
          if unzip -p dist.zip assets/index-*.js | grep -q "PilotStd"; then
            echo "✅ dist.zip 包含最新前端代码"
          else
            echo "⚠️ 警告：dist.zip 可能包含旧代码"
          fi

      - name: Upload dist.zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist.zip
          retention-days: 7

      # ── 2b: 启用 Buildx（Registry Cache 必需）──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 2c: Docker 登录 ──
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─ 2d: 构建 + 推送（Registry Cache + GHA Cache 双通道）──
      - name: Compute cache key from dependencies
        id: cache-key
        run: |
          # 依赖文件变更时缓存自动失效
          HASH=$(cat docker/requirements-docker.txt requirements.txt pyproject.toml web/pnpm-lock.yaml 2>/dev/null | sha256sum | cut -c1-16)
          echo "key=cache-${HASH}" >> $GITHUB_OUTPUT
          echo "依赖缓存键: ${HASH}"

      - name: Check if frontend changed
        id: check-frontend
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^web/"; then
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
            echo "检测到前端代码变更，将禁用 Docker 前端层缓存"
          else
            echo "frontend_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          # 双通道缓存：优先 Registry，备用 GHA cache
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=gha,scope=${{ steps.cache-key.outputs.key }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # 前端变更时添加 cache-bust 参数
          build-args: |
            FRONTEND_CACHE_BUST=${{ steps.check-frontend.outputs.frontend_changed == 'true' && github.sha || '' }}
