# PilotStd CI — 测试 + Docker 镜像推送 ghcr.io
# 用 GITHUB_TOKEN + repository_owner 登录 ghcr
name: Docker CI
run-name: Docker | ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:  # 仅以下变更触发构建
      - 'pilotstd/**'
      - 'tests/**'
      - 'web/**'
      - 'docker/**'
      - 'requirements*.txt'
      - 'docker-compose.yml'
      - '.github/workflows/ci.yml'
      - 'main.py'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      description:
        description: '运行描述（显示在 Actions 列表中）'
        required: false
        default: '手动触发'

concurrency:
  group: version-bump
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pilotstd
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 1: 后端测试
  # ════════════════════════════════════════════════════════════════
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install pytest pytest-xdist

      - name: Forbid production imports from test modules
        run: |
          if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then
            echo "❌ Production code imports test-only module. Abort."
            exit 1
          fi
          echo "✅ No forbidden imports found."

      - name: Run backend tests
        env:
          STANDARD_ROOT: /tmp/standards
        run: |
          mkdir -p /tmp/standards
          python -m pytest tests/ -q --tb=short -n auto \
            --deselect "tests/test_manager.py" \
            --deselect "tests/test_organizer.py" \
            --deselect "tests/test_core.py::TestFileUtils::test_safe_move_and_copy" \
            --deselect "tests/test_cli.py::TestCLIMove::test_cmd_move" \
            --deselect "tests/test_pipeline_router.py" \
            --deselect "tests/test_e2e_adapters.py"

  # ════════════════════════════════════════════════════════════════
  # Job 2: 安全扫描
  # ════════════════════════════════════════════════════════════════
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install bandit pip-audit

      - name: Run Bandit (static security analysis — 建议性)
        run: bandit -r pilotstd/ -f json -o bandit-report.json || echo "bandit found issues (non-blocking)"
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability scan — 建议性)
        run: pip-audit || echo "pip-audit found issues (non-blocking)"
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════
  # Job 3: 前端测试
  # ════════════════════════════════════════════════════════════════
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and test
        run: |
          cd web
          npm ci
          npx vitest run

  # ════════════════════════════════════════════════════════════════
  # Job 4: 构建 + 推送 Docker 镜像
  # ════════════════════════════════════════════════════════════════
  build-and-push:
    needs: [test-frontend]  # 前端必须通过；后端测试+安全扫描建议性
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要 git tag 历史以计算版本号

      # ── 版本号（从最新 git tag 读取，由 release.yml 专责管理）──
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$VERSION" ]; then
              echo "::error::无可用版本标签"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # ── 2a: 构建前端 ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      # ── 2b: 启用 Buildx（Registry Cache 必需）──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 2c: Docker 登录 ──
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 2d: 构建 + 推送（含 Registry Cache 层缓存）──
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
