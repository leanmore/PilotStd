# PilotStd CI/CD — 统一流水线：测试 → 版本管理 → Docker + exe 构建
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_version:
        description: '手动指定版本号（如 1.0.0），留空则自动计算'
        required: false
        default: ''

concurrency:
  group: ci-cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pilotstd
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 1: 后端测试
  # ════════════════════════════════════════════════════════════════
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install pytest pytest-xdist
          pip install -e .

      - name: Forbid production imports from test modules
        run: |
          if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then
            echo "❌ Production code imports test-only module. Abort."
            exit 1
          fi
          echo "✅ No forbidden imports found."

      - name: Run backend tests
        env:
          STANDARD_ROOT: /tmp/standards
          SUPERUSER: superadmin
          ADMIN_USERNAME: superadmin
        run: |
          mkdir -p /tmp/standards
          python -m pytest tests/ -q --tb=short -n auto \
            --deselect "tests/test_manager.py" \
            --deselect "tests/test_organizer.py" \
            --deselect "tests/test_core.py::TestFileUtils::test_safe_move_and_copy" \
            --deselect "tests/test_cli.py::TestCLIMove::test_cmd_move" \
            --deselect "tests/test_pipeline_router.py" \
            --deselect "tests/test_e2e_adapters.py"

      - name: Observability self-check
        run: python tests/test_observability.py --check-all

      - name: Governance documents validation
        run: |
          if grep -q "migrating" docs/governance/capabilities_registry.md; then
            echo "::error::Found entries with status 'migrating' in capabilities_registry.md"
            echo "Please resolve them before merging (migrate or deprecate)."
            exit 1
          fi
          echo "No migrating entries found — governance check passed."

      - name: Check dead Python code
        run: |
          pip install vulture
          vulture pilotstd/ docker/ tests/ scripts/ whitelist.py --min-confidence=80

      - name: GATE-08 — Check dependency completeness
        run: python scripts/check_dependencies.py

      - name: GATE-09 — Check CHANGELOG version consistency
        run: python scripts/check_changelog_version.py

      - name: GATE-15 — 代码规模控制 (阻断模式)
        run: python scripts/check_gate_15_code_size.py

      - name: GATE-16 — 动态属性完整性检查
        run: python scripts/check_gate_16_attr_integrity.py

  # ════════════════════════════════════════════════════════════════
  # Job 2: 安全扫描
  # ════════════════════════════════════════════════════════════════
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install bandit pip-audit detect-secrets

      - name: Run detect-secrets (凭证泄漏扫描)
        run: detect-secrets-hook --baseline .secrets.baseline

      - name: Run Bandit (static security analysis — 建议性)
        run: bandit -r pilotstd/ -f json -o bandit-report.json || echo "bandit found issues (non-blocking)"
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability scan — 建议性)
        run: pip-audit || echo "pip-audit found issues (non-blocking)"
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════
  # Job 3: 前端测试
  # ════════════════════════════════════════════════════════════════
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd web
          rm -rf node_modules/.vite
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: |
          cd web
          pnpm run type-check

      - name: Run tests
        run: |
          cd web
          pnpm run test

      - name: Check dead TypeScript exports
        run: |
          cd web
          pnpm add -D ts-prune
          pnpm ts-prune --error

      - name: GATE-10 — Check UI sensitive fields protection
        run: python scripts/check_ui_sensitive_fields.py

  # ════════════════════════════════════════════════════════════════
  # Job 4: 入仓合规检查
  # ════════════════════════════════════════════════════════════════
  repo-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repo compliance check
        env:
          BASE_BRANCH: main
        run: bash .github/scripts/check-repo-compliance.sh

  # ════════════════════════════════════════════════════════════════
  # Job 5: 版本管理（测试全部通过后执行）
  # ════════════════════════════════════════════════════════════════
  version:
    needs: [test-backend, test-frontend, security-scan, repo-compliance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag as base version
        id: base
        run: |
          # 以 Git Tag 为唯一事实来源，解决跨端版本号对齐问题
          BASE_VER=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          echo "base_version=$BASE_VER" >> $GITHUB_OUTPUT

      - name: Get commit messages since last tag
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            MSGS=$(git log ${LAST_TAG}..HEAD --format=%s | tr '\n' '|')
          else
            MSGS=$(git log --format=%s | tr '\n' '|')
          fi
          echo "messages=${MSGS//'%'/'%25'}" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        env:
          BASE_VERSION: ${{ steps.base.outputs.base_version }}
          COMMIT_MSGS: ${{ steps.commits.outputs.messages }}
        run: |
          OVERRIDE="${{ github.event.inputs.override_version }}"

          if [ -n "$OVERRIDE" ]; then
            NEW_VER="$OVERRIDE"
          else
            NEW_VER=$(python scripts/version.py)
          fi

          if [ -n "$NEW_VER" ] && [ "$NEW_VER" != "${{ steps.base.outputs.base_version }}" ]; then
            echo "version=$NEW_VER" >> $GITHUB_OUTPUT
            echo "bumped=true" >> $GITHUB_OUTPUT
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit version bump
        if: steps.bump.outputs.bumped == 'true'
        run: |
          # 1. 更新 VERSION 文件
          echo "${{ steps.bump.outputs.version }}" > VERSION

          # 2. 精准替换 pilotstd/__init__.py 第 10 行的 __version__
          sed -i "10s/__version__ = .*/__version__ = \"${{ steps.bump.outputs.version }}\"/" pilotstd/__init__.py

          # 3. 统一提交并推送
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION pilotstd/__init__.py
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"
          git push
          # 防冲突：等待 push 完成后再打 tag
          sleep 2

      - name: Create and push tag
        if: steps.bump.outputs.bumped == 'true'
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG" --force-with-lease

  # ════════════════════════════════════════════════════════════════
  # Job 6: Docker 镜像构建
  # ════════════════════════════════════════════════════════════════
  docker:
    name: docker
    needs: version
    if: |
      always() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build frontend
        run: |
          cd web
          rm -rf node_modules/.vite
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}

  # ════════════════════════════════════════════════════════════════
  # Job 7: exe 构建
  # ════════════════════════════════════════════════════════════════
  exe:
    name: exe
    needs: version
    if: |
      always() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: desktop/requirements-win.txt

      - name: Install dependencies
        run: |
          pip install -r desktop/requirements-win.txt
          pip install fastapi uvicorn
          pip install pyinstaller

      - name: Create data directory if not exists
        run: |
          if not exist data mkdir data
        shell: cmd

      - name: Build exe with PyInstaller
        run: pyinstaller desktop/PilotStd.spec --noconfirm

      - name: Upload exe to Release
        if: needs.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: PilotStd v${{ needs.version.outputs.version }}
          make_latest: true
          files: dist/PilotStd.exe
          body: |
            ## PilotStd v${{ needs.version.outputs.version }}
            > 提交: ${{ github.sha }}

            PyInstaller 编译的 Windows 单文件版本。

            ### 系统要求
            - Windows 10/11 64-bit
            - 无需安装 Python
