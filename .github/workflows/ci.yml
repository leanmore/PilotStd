# PilotStd CI/CD — 统一流水线：测试 → 版本管理 → Docker + exe 构建
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pilotstd
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 1: 后端测试
  # ════════════════════════════════════════════════════════════════
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install pytest pytest-xdist
          pip install -e .

      - name: Forbid production imports from test modules
        run: |
          if grep -rn "from pilotstd\..*\.mock\|from tests\." pilotstd/ --include="*.py" | grep -v "except ImportError\|_get_mock_adapter"; then
            echo "❌ Production code imports test-only module. Abort."
            exit 1
          fi
          echo "✅ No forbidden imports found."

      - name: Run backend tests
        env:
          STANDARD_ROOT: /tmp/standards
          SUPERUSER: superadmin
          ADMIN_USERNAME: superadmin
        run: |
          mkdir -p /tmp/standards
          python -m pytest tests/ -q --tb=short -n auto \
            --deselect "tests/test_manager.py" \
            --deselect "tests/test_organizer.py" \
            --deselect "tests/test_core.py::TestFileUtils::test_safe_move_and_copy" \
            --deselect "tests/test_cli.py::TestCLIMove::test_cmd_move" \
            --deselect "tests/test_pipeline_router.py" \
            --deselect "tests/test_e2e_adapters.py"

      - name: Observability self-check
        run: python tests/test_observability.py --check-all

      - name: Governance documents validation
        run: |
          if grep -q "migrating" docs/governance/capabilities_registry.md; then
            echo "::error::Found entries with status 'migrating' in capabilities_registry.md"
            echo "Please resolve them before merging (migrate or deprecate)."
            exit 1
          fi
          echo "No migrating entries found — governance check passed."

      - name: Check dead Python code
        run: |
          pip install vulture
          vulture pilotstd/ docker/ tests/ scripts/ whitelist.py --min-confidence=80

      - name: GATE-08 — Check dependency completeness
        run: python scripts/check_dependencies.py

      - name: GATE-09 — Check CHANGELOG version consistency
        run: python scripts/check_changelog_version.py

      - name: GATE-15 — 代码规模控制 (阻断模式)
        run: python scripts/check_gate_15_code_size.py

      - name: GATE-16 — 动态属性完整性检查
        run: python scripts/check_gate_16_attr_integrity.py

  # ════════════════════════════════════════════════════════════════
  # Job 2: 安全扫描
  # ════════════════════════════════════════════════════════════════
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install bandit pip-audit detect-secrets

      - name: Run detect-secrets (凭证泄漏扫描)
        run: detect-secrets-hook --baseline .secrets.baseline

      - name: Run Bandit (static security analysis — 建议性)
        run: bandit -r pilotstd/ -f json -o bandit-report.json || echo "bandit found issues (non-blocking)"
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability scan — 建议性)
        run: pip-audit || echo "pip-audit found issues (non-blocking)"
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════
  # Job 3: 前端测试
  # ════════════════════════════════════════════════════════════════
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: |
          cd web
          pnpm run type-check

      - name: Run tests
        run: |
          cd web
          pnpm run test

      - name: Check dead TypeScript exports
        run: |
          cd web
          pnpm add -D ts-prune
          pnpm ts-prune --error

      - name: GATE-10 — Check UI sensitive fields protection
        run: python scripts/check_ui_sensitive_fields.py

  # ════════════════════════════════════════════════════════════════
  # Job 4: 入仓合规检查
  # ════════════════════════════════════════════════════════════════
  repo-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repo compliance check
        env:
          BASE_BRANCH: main
        run: bash .github/scripts/check-repo-compliance.sh

  # ════════════════════════════════════════════════════════════════
  # Job 5: 版本管理（测试全部通过后执行）
  # ════════════════════════════════════════════════════════════════
  version:
    needs: [test-backend, test-frontend, security-scan, repo-compliance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit messages since last tag
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log ${LAST_TAG}..HEAD --format=%s)
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bump version
        id: bump
        env:
          COMMIT_MSGS: ${{ steps.commits.outputs.commits }}
        run: |
          NEW_VER=$(python scripts/version.py)
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          CURRENT=$(cat VERSION)
          if [ "$NEW_VER" != "$CURRENT" ]; then
            echo "bumped=true" >> $GITHUB_OUTPUT
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi
          echo "Version: $NEW_VER (bumped=$([ "$NEW_VER" != "$CURRENT" ] && echo true || echo false))"

      - name: Commit version bump
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Create and push tag
        if: steps.bump.outputs.bumped == 'true'
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # ════════════════════════════════════════════════════════════════
  # Job 6: 统一构建 — 矩阵策略并行 Docker 镜像 + exe
  # ════════════════════════════════════════════════════════════════
  build:
    needs: version
    if: |
      always() &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ---- Docker 构建 (ubuntu-latest) ----
      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: runner.os == 'Linux'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version.outputs.version }}

      # ---- exe 构建 (windows-latest) ----
      - name: Setup Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: desktop/requirements-win.txt

      - name: Install dependencies
        if: runner.os == 'Windows'
        run: |
          pip install -r desktop/requirements-win.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        if: runner.os == 'Windows'
        run: pyinstaller desktop/PilotStd.spec --noconfirm

      - name: Upload exe to Release
        if: runner.os == 'Windows' && needs.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: PilotStd v${{ needs.version.outputs.version }}
          make_latest: true
          files: dist/PilotStd.exe
          body: |
            ## PilotStd v${{ needs.version.outputs.version }}
            > 提交: ${{ github.sha }}

            PyInstaller 编译的 Windows 单文件版本。

            ### 系统要求
            - Windows 10/11 64-bit
            - 无需安装 Python
