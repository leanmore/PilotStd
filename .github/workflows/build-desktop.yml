# PilotStd 桌面端 CI — PyInstaller 打包 + GitHub Release
name: Build Desktop
run-name: Desktop | ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-build
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pip install -r desktop/requirements-win.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Python: $(python --version)"
          if (-not (Test-Path data)) { New-Item -ItemType Directory data | Out-Null }
          $free = (Get-PSDrive -Name (Get-Location).Drive.Name).Free
          if ($free -lt 3GB) {
            Write-Error "磁盘空间不足 (需要 ≥3GB，实际 $([math]::Round($free/1GB,1)) GB)"
            exit 1
          }
          pyinstaller desktop/PilotStd.spec --noconfirm
          $exe_path = "dist/PilotStd.exe"
          if (-not (Test-Path $exe_path)) {
            Write-Error "PyInstaller 产物缺失: $exe_path"
            exit 1
          }
          $exe_size_mb = "{0:N1} MB" -f ((Get-Item $exe_path).Length / 1MB)
          if ((Get-Item $exe_path).Length -lt 10MB) {
            Write-Error "PyInstaller 产物异常(过小): $exe_path ($exe_size_mb)"
            exit 1
          }
          Write-Host "产物: $exe_path ($exe_size_mb)"

      - name: Package to zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $zip_name = "PilotStd-$version.zip"
          Compress-Archive -Path "dist/PilotStd.exe" -DestinationPath $zip_name
          if (-not (Test-Path $zip_name)) {
            Write-Error "打包失败: $zip_name"
            exit 1
          }
          Write-Host "打包完成: $zip_name"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PilotStd-${{ steps.version.outputs.version }}
          path: PilotStd-${{ steps.version.outputs.version }}.zip
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: PilotStd ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            ## PilotStd ${{ steps.version.outputs.version }}
            > 提交: ${{ github.sha }}

            PyInstaller 编译的 Windows 单文件版本。

            ### 系统要求
            - Windows 10/11 64-bit
            - 无需安装 Python
          files: PilotStd-${{ steps.version.outputs.version }}.zip
