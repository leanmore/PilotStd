name: Trinity Auto Update

on:
  workflow_run:
    workflows: ["Trinity Gate CI"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TRINITY_BOT_PAT }}

      # 修正1: 用 GITHUB_RUN_ID 隔离并发分支
      - name: Setup unique branch
        run: |
          BRANCH="auto-trinity/update-${{ github.run_id }}"
          git fetch origin "$BRANCH" 2>/dev/null || true
          git checkout -B "$BRANCH" origin/main
          git pull --rebase origin "$BRANCH" 2>/dev/null || true
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV

      # 修正2: PR 去重，避免堆积
      - name: Check existing auto PR
        env:
          GH_TOKEN: ${{ secrets.TRINITY_BOT_PAT }}
        run: |
          EXISTING=$(gh pr list --state open --head "auto-trinity/*" \
            --json headRefName --jq '.[].headRefName' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "⏭️  Skipping: existing open PR found ($EXISTING)"
            echo "SKIP_AUTO_UPDATE=true" >> $GITHUB_ENV
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP_AUTO_UPDATE != 'true'
        with:
          python-version: "3.12"

      - name: Regenerate capabilities
        if: env.SKIP_AUTO_UPDATE != 'true'
        run: python scripts/generate_capabilities.py

      - name: Commit & Push (safe)
        if: env.SKIP_AUTO_UPDATE != 'true'
        run: |
          git config user.name "Trinity Bot"
          git config user.email "trinity-bot@noreply.github.com"
          git add docs/governance/capabilities_registry.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: auto-update capabilities matrix [skip ci]"
          git push origin "${{ env.BRANCH_NAME }}" --force-with-lease

      - name: Create/Update PR
        if: env.SKIP_AUTO_UPDATE != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.TRINITY_BOT_PAT }}
          branch: ${{ env.BRANCH_NAME }}
          title: "Auto-update: Capabilities Matrix"
          body: |
            Auto-generated by Trinity Gate after successful CI run.

            - Source commit: ${{ github.event.workflow_run.head_sha }}
            - Run ID: ${{ github.run_id }}

            > Please review before merging.
          labels: auto-generated, trinity
          delete-branch: true
