name: Trinity Gate CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: trinity-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trinity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 修正4: 防止 --deep 检查超时

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 修正1: 确保 origin/main 可用（fetch 即可，下游脚本均使用 origin/main 远程引用）
      - name: Fetch main branch for diff comparison
        run: git fetch origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install ruff vulture mypy

      # 职责边界说明:
      # 本 job 只做门禁检查：--deep（Ruff/Mypy/Vulture/G-038）+ 治理守护
      #   （Schema 一致性 / G-032 文档健康度 / G-037 / G-030 / G-033）
      # 文档生成只在本地执行：bash scripts/check_all.sh --docs → 人工确认后自行提交。
      #   STATUS.md 为 gitignored 本地状态文件，CI 不生成、不上传、不 push。
      #   （原 `--deep --docs` 因 check_all.sh 参数解析缺陷从未真正跑到 docs 段，
      #    相应的 pytest 与 artifact 上传步骤长期空转，2026-09-13 一并清理）
      - name: Run Trinity Gate (--deep)
        id: trinity_gate
        run: bash scripts/check_all.sh --deep
        env:
          CI: "true"

      - name: Failure Guidance
        if: failure() && steps.trinity_gate.outcome == 'failure'
        run: |
          echo "::error::❌ Trinity Gate 失败：请在上方日志定位具体门禁项。"
          echo ""
          echo "🔧 常见修复（本地执行、确认后再提交）："
          echo "  # 文档生成 + 守护（STATUS.md / coverage-report.md）"
          echo "  bash scripts/check_all.sh --docs"
          echo "  # 能力矩阵与代码同步（AGENTS.md 第七节要求，无独立门禁，需人工执行）"
          echo "  python scripts/generate_capabilities.py"
          echo "  git add docs/governance/capabilities_registry.md && git commit --amend --no-edit"
          echo ""
          echo "💡 修复指引: docs/governance/trinity-how-to-fix.md"
          exit 1

      - name: Post PR comment with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const jobStatus = '${{ job.status }}';
            const statusIcon = jobStatus === 'success' ? '✅' : '❌';

            const body = `## ${statusIcon} Trinity Gate Report

            | Check | Result |
            |-------|--------|
            | Deep (--deep) + 治理守护（Schema/G-032/G-037/G-030/G-033） | ${jobStatus === 'success' ? '✅' : '❌'} |

            📄 文档生成由**本地**执行（CI 不生成、不上传、不 push）：
            运行 \`bash scripts/check_all.sh --docs\` 生成 STATUS.md 与 docs/testing/coverage-report.md，
            人工确认后再提交入库文档。

            > 🔧 修复指引: 参见 [Trinity Gate How-to-Fix](docs/governance/trinity-how-to-fix.md)
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
