# GUI 竞态复现探针（#34 / T-26 哨兵，第十二轮 R12-4 的 R4）
#
# 目的：在**与 CI `test-gui-unit` 同口径的环境**（windows-latest + Python 3.12 + PyQt6 6.11.2）
#       下循环运行 EventBus 集成测试，为 #34 的“Windows 原生访问违例”取得实证：
#         · R2 静止协议落地前：捕获 access violation / 堆破坏的直接证据；
#         · R2 落地后：证明 N 次循环 0 崩溃。
#
# 用法（手动触发，不进 push/PR 常态流水线）：
#   gh workflow run gui-race-probe.yml -f loops=50
#   或 GitHub UI → Actions → GUI race probe (R4) → Run workflow
#
# 设计取舍：
#   · 单独一个 workflow 文件（而不是塞进 ci.yml）——`workflow_dispatch` 会执行该文件内的**全部**作业，
#     若放进 ci.yml 则每次探针都会连带跑完整流水线（14 个作业），既慢又污染归因。
#   · 只循环 `tests/gui/test_event_bus_integration.py`（崩溃点所在文件，含 13 个用例 + R2 协议用例）；
#     全量 `tests/gui/` 单轮 ≈4~8 分钟，循环 N 次不现实。
#   · 失败即 `exit 1`，并把每次迭代的退出码打印出来，便于定位第几次触发。

name: GUI race probe (R4)

on:
  workflow_dispatch:
    inputs:
      loops:
        description: '循环次数（每轮跑一次 EventBus 集成测试）'
        required: false
        default: '30'

concurrency:
  group: gui-race-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gui-race-probe:
    name: gui-race-probe (R4)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements-win.txt

      - name: Install dependencies (pinned Qt runtime 6.11.2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 与 CI test-gui-unit 同口径：reqs 钉住 PyQt6==6.11.0（PyPI 上 PyQt6 最新即 6.11.0，没有 6.11.2）
          pip install -r desktop/requirements-win.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements-win.txt 安装失败" }
          pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements-dev.txt 安装失败" }
          # Qt 运行库（PyQt6-Qt6）才是「Qt 版本」的真身：显式钉到 6.11.2
          pip install "PyQt6-Qt6==6.11.2"
          if ($LASTEXITCODE -ne 0) { throw "PyQt6-Qt6==6.11.2 安装失败" }
          pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "pilotstd 可编辑安装失败" }

      - name: Verify environment fingerprint (runtime Qt must be 6.11.2)
        shell: pwsh
        run: |
          # 口径说明：QT_VERSION_STR 是 PyQt6 的**编译期**常量（PyQt6==6.11.0 → 恒为 6.11.0），
          # 真正加载的 Qt 运行库版本要用 qVersion()（此前指纹只打 QT_VERSION_STR，导致误判「pin 未生效」）。
          python -c "import sys; from PyQt6.QtCore import qVersion, QT_VERSION_STR, PYQT_VERSION_STR; print('python', sys.version.split()[0]); print('QT_VERSION_STR(build)', QT_VERSION_STR); print('qVersion(runtime)', qVersion()); print('PYQT_VERSION_STR', PYQT_VERSION_STR); assert qVersion() == '6.11.2', 'Qt 运行库版本未钉住: ' + qVersion(); assert PYQT_VERSION_STR == '6.11.0', 'PyQt6 版本异常: ' + PYQT_VERSION_STR"
          if ($LASTEXITCODE -ne 0) { throw "环境指纹校验失败（Qt 运行库必须为 6.11.2）" }


      - name: Loop EventBus integration tests
        shell: pwsh
        env:
          SUPERUSER: superadmin
          PILOTSTD_GUI_TEST: "1"
        run: |
          $loops = 0
          [void][int]::TryParse("${{ github.event.inputs.loops }}", [ref]$loops)
          if ($loops -le 0) { $loops = 30 }
          $fail = 0
          for ($i = 1; $i -le $loops; $i++) {
            Write-Output "=== iteration $i / $loops ==="
            python -m pytest tests/gui/test_event_bus_integration.py -q `
              --timeout=120 --timeout_method=thread -p no:cacheprovider
            if ($LASTEXITCODE -ne 0) {
              $fail++
              Write-Output "!!! iteration $i FAILED (exit $LASTEXITCODE)"
            }
          }
          Write-Output "=== RESULT: loops=$loops failures=$fail ==="
          if ($fail -gt 0) { exit 1 }
