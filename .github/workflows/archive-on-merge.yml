name: Archive pending documents
on:
  pull_request:
    types: [closed]
    branches: [main, develop]
jobs:
  archive:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive pending
        run: |
          PENDING="docs/pending"
          ARCHIVE="docs/archive/$(date +%Y-%m-%d)"
          if [ -d "$PENDING" ] && [ "$(ls -A $PENDING 2>/dev/null)" ]; then
            mkdir -p "$ARCHIVE"
            mv "$PENDING"/* "$ARCHIVE/"
            echo "📦 Archived files to $ARCHIVE"
            echo "archived=true" >> $GITHUB_ENV
          else
            echo "📭 No pending documents"
            echo "archived=false" >> $GITHUB_ENV
          fi
      - name: Commit archive
        if: env.archived == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/archive/ docs/pending/
          git diff --staged --quiet || git commit -m "chore: auto-archive pending documents [skip ci]"
          git push
