name: E2E Coverage Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r docker/requirements-docker.txt
          pip install pytest pytest-cov responses respx pytest-httpserver
          pip install -e .

      - name: Run E2E + Integration tests with coverage
        run: |
          python -m pytest tests/e2e/ tests/integration/ \
            --cov=pilotstd \
            --cov-config=tests/e2e/.coveragerc \
            --cov-report=xml:e2e-coverage.xml \
            --cov-report=html:htmlcov-e2e \
            --cov-report=term-missing \
            -v

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-html
          path: htmlcov-e2e/
          retention-days: 30

      - name: Upload XML coverage data
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-xml
          path: e2e-coverage.xml
          retention-days: 30

      - name: Print baseline summary
        run: |
          echo "========================================="
          echo "E2E Coverage Baseline Report"
          echo "========================================="
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('e2e-coverage.xml')
          rate = tree.getroot().attrib.get('line-rate', 'N/A')
          pct = f'{float(rate)*100:.1f}%' if rate != 'N/A' else 'N/A'
          print(f'Line Coverage: {pct}')
          "
          echo "========================================="
